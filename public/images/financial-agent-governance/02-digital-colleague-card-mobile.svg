<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1180" viewBox="0 0 390 1180" role="img" aria-labelledby="title desc">
  <title id="title">数字员工的治理档案</title>
  <desc id="desc">数字员工从入职定义身份岗位，到运行中受权限和主管控制，再到记录、记忆管理与停用。</desc>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.head{font-size:18px;font-weight:700}.node{font-size:15px;font-weight:700}.body{font-size:12px}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="390" height="1180" fill="#f6f2e9"/><text x="22" y="32" class="label">03 / 数字员工</text><text x="22" y="69" class="title">治理从入职开始</text><text x="22" y="101" class="title">不在上线后补手续</text><text x="22" y="130" class="small">每个字段都要对应管理动作和负责人。</text>
  <g transform="translate(22 164)"><rect width="346" height="282" rx="10" fill="#fffdf8" stroke="#c7beae"/><rect width="346" height="48" rx="10" fill="#e7edf1"/><rect y="38" width="346" height="10" fill="#e7edf1"/><text x="18" y="31" class="head">入职前：把工作交代清楚</text><text x="20" y="82" class="node">独立身份</text><text x="128" y="82" class="body">工号、服务账号、模型版本</text><text x="20" y="132" class="node">岗位职责</text><text x="128" y="132" class="body">服务谁，做什么，不做什么</text><text x="20" y="182" class="node">Skill 清单</text><text x="128" y="182" class="body">用途、输入输出、失败方式</text><text x="20" y="232" class="node">上岗评测</text><text x="128" y="232" class="body">任务题、红线题、执行测试</text></g>
  <g transform="translate(22 466)"><rect width="346" height="282" rx="10" fill="#f0e3ca" stroke="#c7beae"/><rect width="346" height="48" rx="10" fill="#ead7b3"/><rect y="38" width="346" height="10" fill="#ead7b3"/><text x="18" y="31" class="head">运行中：限制行动范围</text><text x="20" y="82" class="node">权限网关</text><text x="128" y="82" class="body">最小权限、临时授权、拒绝记录</text><text x="20" y="132" class="node">业务主管</text><text x="128" y="132" class="body">审批高风险动作，接管异常</text><text x="20" y="182" class="node">人工接管</text><text x="128" y="182" class="body">不可逆节点、异常、资料冲突</text><text x="20" y="232" class="node">运行监控</text><text x="128" y="232" class="body">越权、失败、延迟、异常积压</text></g>
  <g transform="translate(22 768)"><rect width="346" height="282" rx="10" fill="#1b3654"/><rect width="346" height="48" rx="10" fill="#284968"/><rect y="38" width="346" height="10" fill="#284968"/><text x="18" y="31" class="head white">可追责：保留完整过程</text><text x="20" y="82" class="node white">工作底稿</text><text x="128" y="82" class="body white">来源、判断、动作、审批与结果</text><text x="20" y="132" class="node white">记忆规则</text><text x="128" y="132" class="body white">写入、确认、期限、更正、删除</text><text x="20" y="182" class="node white">反馈复测</text><text x="128" y="182" class="body white">失败进入知识、规则或题集</text><text x="20" y="232" class="node white">停用离岗</text><text x="128" y="232" class="body white">回收权限，冻结版本，保存记录</text></g>
  <text x="22" y="1094" class="small">身份回答谁在做，权限回答能做什么，</text><text x="22" y="1116" class="small">主管和底稿回答谁负责。</text><text x="22" y="1160" class="small">作者根据圆桌讨论整理</text>
</svg>
