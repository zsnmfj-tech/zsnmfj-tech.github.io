<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1120" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc">
  <title id="title">金融 AI 底层能力架构</title>
  <desc id="desc">架构由金融领域模型能力、企业上下文和受控业务系统三层组成，评测与治理贯穿每一层。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.node{font-size:18px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}.chip{font-size:12px;font-weight:700}
  </style>
  <rect width="390" height="1120" fill="#f6f2e9"/>
  <text x="22" y="32" class="label">01 / 底层能力</text>
  <text x="22" y="69" class="title">底层不只有模型</text>
  <text x="22" y="101" class="title">还要接上机构自己的事实</text>
  <text x="22" y="130" class="small">领域能力、企业上下文和业务系统要一起工作。</text>

  <g transform="translate(22 164)">
    <rect width="346" height="206" rx="10" fill="#f0e3ca" stroke="#c7beae"/>
    <text x="20" y="32" class="label">基础能力</text><text x="20" y="64" class="node">金融领域模型</text>
    <rect x="20" y="86" width="142" height="34" rx="17" fill="#fffdf8"/><text x="91" y="108" text-anchor="middle" class="chip">金融知识</text>
    <rect x="182" y="86" width="142" height="34" rx="17" fill="#fffdf8"/><text x="253" y="108" text-anchor="middle" class="chip">法规合规</text>
    <rect x="20" y="132" width="142" height="34" rx="17" fill="#fffdf8"/><text x="91" y="154" text-anchor="middle" class="chip">授信风险</text>
    <rect x="182" y="132" width="142" height="34" rx="17" fill="#fffdf8"/><text x="253" y="154" text-anchor="middle" class="chip">财富管理</text>
    <text x="20" y="190" class="small">本地语言、法规、商品和消费者情境</text>
  </g>
  <path d="M195 372V393" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(22 404)">
    <rect width="346" height="170" rx="10" fill="#e7edf1" stroke="#c7beae"/>
    <text x="20" y="32" class="label">机构上下文</text><text x="20" y="64" class="node">Enterprise IQ</text>
    <text x="20" y="98" class="body">制度与产品 · 客户与合约状态</text>
    <text x="20" y="126" class="body">组织关系 · 历史案例 · 外部信号</text>
    <text x="20" y="153" class="small">按任务读取，标明来源、时效和边界</text>
  </g>
  <path d="M195 576V597" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(22 608)">
    <rect width="346" height="148" rx="10" fill="#dce8e5" stroke="#c7beae"/>
    <text x="20" y="32" class="label">执行环境</text><text x="20" y="64" class="node">受控业务系统</text>
    <text x="20" y="98" class="body">核心系统 · CRM · 理赔 · 风险</text>
    <text x="20" y="126" class="body">统一身份、权限、工具调用和结果写回</text>
  </g>

  <g transform="translate(22 790)">
    <rect width="346" height="264" rx="10" fill="#1b3654"/>
    <text x="20" y="34" class="label" fill="#d3ad75">贯穿全程</text><text x="20" y="68" class="node white">评测与治理</text>
    <line x1="20" y1="88" x2="326" y2="88" stroke="#657586"/>
    <circle cx="30" cy="120" r="6" fill="#b88a49"/><text x="48" y="125" class="body white">领域知识与推理</text>
    <circle cx="30" cy="154" r="6" fill="#b88a49"/><text x="48" y="159" class="body white">本地适配与时效</text>
    <circle cx="30" cy="188" r="6" fill="#b88a49"/><text x="48" y="193" class="body white">零容忍风险项</text>
    <circle cx="30" cy="222" r="6" fill="#b88a49"/><text x="48" y="227" class="body white">工具、权限与运行回归测试</text>
    <text x="20" y="250" class="small white">模型、知识或工具变更后复测</text>
  </g>

  <text x="22" y="1097" class="small">作者根据圆桌讨论整理</text>
</svg>
