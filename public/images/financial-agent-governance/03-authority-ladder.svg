<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">金融 Agent 的分级授权路径</title>
  <desc id="desc">Agent 从只读辅助、受控草拟、可撤回写入到高影响动作逐级获得权限，每一级都以评测和运行证据为门槛，高影响动作由人工确认。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.label{font-size:15px;fill:#986b2e;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="960" height="640" fill="#f6f2e9"/><text x="36" y="38" class="label">02 / 分级授权</text><text x="36" y="82" class="title">权限跟着证据走，不跟着演示效果走</text><text x="36" y="114" class="small">每一级都增加新的业务动作，也增加新的评测、审批和回退要求。</text>

  <g transform="translate(36 354)"><rect width="198" height="154" rx="10" fill="#fffdf8" stroke="#c7beae"/><text x="18" y="34" class="label">LEVEL 1</text><text x="18" y="68" class="head">只读辅助</text><text x="18" y="98" class="body">查询、汇总、显示来源</text><text x="18" y="124" class="small">不改变业务状态</text></g>
  <g transform="translate(256 294)"><rect width="198" height="214" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="18" y="34" class="label">LEVEL 2</text><text x="18" y="68" class="head">受控草拟</text><text x="18" y="98" class="body">报告、建议、初步审查</text><text x="18" y="128" class="small">员工修改后使用</text><line x1="18" y1="153" x2="180" y2="153" stroke="#c7beae"/><text x="18" y="182" class="small">证据：任务通过率</text></g>
  <g transform="translate(476 234)"><rect width="198" height="274" rx="10" fill="#f0e3ca" stroke="#c7beae"/><text x="18" y="34" class="label">LEVEL 3</text><text x="18" y="68" class="head">可撤回写入</text><text x="18" y="98" class="body">更新内部状态、发起流程</text><text x="18" y="128" class="small">规则校验、幂等、回滚</text><line x1="18" y1="153" x2="180" y2="153" stroke="#cbb993"/><text x="18" y="182" class="small">证据：真实运行</text><text x="18" y="207" class="small">越权与失败记录</text></g>
  <g transform="translate(696 174)"><rect width="228" height="334" rx="10" fill="#1b3654"/><text x="18" y="34" class="label">LEVEL 4</text><text x="18" y="68" class="head white">高影响动作</text><text x="18" y="98" class="body white">资金、权益、授信与理赔</text><text x="18" y="128" class="small white">执行前由有权人员确认</text><line x1="18" y1="153" x2="210" y2="153" stroke="#5b7085"/><text x="18" y="182" class="small white">证据：红线题全过</text><text x="18" y="207" class="small white">异常处置稳定</text><rect x="18" y="246" width="192" height="54" rx="7" fill="#fffdf8"/><text x="114" y="279" text-anchor="middle" class="head">人工确认点</text></g>
  <path d="M234 431H248M454 371H468M674 311H688" stroke="#986b2e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="36" y="544" width="888" height="52" rx="8" fill="#dce8e5"/><text x="58" y="576" class="head">每次升级都记录：</text><text x="228" y="576" class="body">新增动作</text><text x="330" y="576" class="body">批准人</text><text x="419" y="576" class="body">评测范围</text><text x="523" y="576" class="body">监控指标</text><text x="627" y="576" class="body">回退方式</text><text x="731" y="576" class="body">复核日期</text>
  <text x="36" y="627" class="small">作者根据圆桌讨论中的“高价值、低风险”和逐步扩大权限建议整理</text>
</svg>
