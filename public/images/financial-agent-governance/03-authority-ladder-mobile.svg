<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc">
  <title id="title">金融 Agent 的分级授权路径</title>
  <desc id="desc">Agent 从只读辅助、受控草拟、可撤回写入到高影响动作逐级获得权限，高影响动作由人工确认。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="390" height="1160" fill="#f6f2e9"/><text x="22" y="32" class="label">02 / 分级授权</text><text x="22" y="69" class="title">权限跟着证据走</text><text x="22" y="101" class="title">不跟着演示效果走</text><text x="22" y="130" class="small">每次升级都增加动作与控制要求。</text>
  <g transform="translate(22 166)"><rect width="346" height="148" rx="9" fill="#fffdf8" stroke="#c7beae"/><text x="18" y="31" class="label">LEVEL 1</text><text x="18" y="65" class="head">只读辅助</text><text x="18" y="94" class="body">查询、汇总、显示来源</text><text x="18" y="121" class="small">不改变业务状态</text></g><path d="M195 316V334" stroke="#986b2e" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 344)"><rect width="346" height="170" rx="9" fill="#e7edf1" stroke="#c7beae"/><text x="18" y="31" class="label">LEVEL 2</text><text x="18" y="65" class="head">受控草拟</text><text x="18" y="94" class="body">报告、建议、初步审查</text><text x="18" y="121" class="small">员工修改后使用 · 记录任务通过率</text></g><path d="M195 516V534" stroke="#986b2e" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 544)"><rect width="346" height="192" rx="9" fill="#f0e3ca" stroke="#c7beae"/><text x="18" y="31" class="label">LEVEL 3</text><text x="18" y="65" class="head">可撤回写入</text><text x="18" y="94" class="body">更新内部状态、发起流程</text><text x="18" y="121" class="small">规则校验、幂等、回滚</text><text x="18" y="151" class="small">证据：真实运行、越权与失败记录</text></g><path d="M195 738V756" stroke="#986b2e" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 766)"><rect width="346" height="222" rx="9" fill="#1b3654"/><text x="18" y="31" class="label">LEVEL 4</text><text x="18" y="65" class="head white">高影响动作</text><text x="18" y="94" class="body white">资金、权益、授信与理赔</text><text x="18" y="121" class="small white">红线题全过，异常处置稳定</text><rect x="18" y="151" width="310" height="48" rx="7" fill="#fffdf8"/><text x="173" y="181" text-anchor="middle" class="head">执行前由有权人员确认</text></g>
  <rect x="22" y="1022" width="346" height="86" rx="9" fill="#dce8e5"/><text x="42" y="1053" class="head">每次升级都记录</text><text x="42" y="1081" class="body">新增动作 · 批准人 · 评测 · 回退方式</text><text x="22" y="1142" class="small">作者根据圆桌讨论整理</text>
</svg>
