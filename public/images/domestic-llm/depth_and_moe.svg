<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">深度信息流与 MoE 专家配置</title>
  <desc id="desc">比较 Kimi K3、DeepSeek-V4-Pro、GLM-5.2、MiniMax M3 和 Qwen3.5 的层数、深度连接方式、专家总数和每 token 激活专家数。</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#ddd8cc"/></pattern>
  </defs>
  <rect width="1040" height="700" fill="#f5f3eb"/>
  <rect width="1040" height="700" fill="url(#dots)" opacity=".4"/>
  <text x="60" y="48" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#8f6a34">DEPTH × EXPERT SPACE</text>
  <text x="60" y="89" font-family="Noto Serif SC, Songti SC, serif" font-size="32" font-weight="700" fill="#171714">扩展不只发生在序列长度</text>
  <text x="60" y="118" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#67655f">AttnRes 与 mHC 改写深度信息流；MoE 让专家空间继续增大，却只激活其中少量路径。</text>
  <g font-family="Inter, Noto Sans SC, sans-serif">
    <text x="60" y="162" font-size="13" font-weight="700" letter-spacing="1.5" fill="#77736a">MODEL / DEPTH PATH</text>
    <text x="550" y="162" font-size="13" font-weight="700" letter-spacing="1.5" fill="#77736a">ROUTED EXPERTS</text>
    <text x="900" y="162" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1.5" fill="#77736a">PER TOKEN</text>
    <line x1="60" y1="176" x2="980" y2="176" stroke="#cfc9bc"/>

    <g transform="translate(0 0)">
      <text x="60" y="221" font-size="16" font-weight="700" fill="#171714">Kimi K3</text>
      <text x="60" y="244" font-size="13" fill="#6c6962">93 层 · AttnRes 跨块读取</text>
      <g fill="#d9c6a8"><rect x="262" y="196" width="46" height="46" rx="9"/><rect x="320" y="196" width="46" height="46" rx="9"/><rect x="378" y="196" width="46" height="46" rx="9"/><rect x="436" y="196" width="46" height="46" rx="9"/></g>
      <path d="M274 231c30-52 142-52 196 0" fill="none" stroke="#8f6a34" stroke-width="2"/>
      <circle cx="274" cy="231" r="4" fill="#8f6a34"/><circle cx="470" cy="231" r="4" fill="#8f6a34"/>
      <rect x="550" y="206" width="350" height="20" rx="10" fill="#e4ded2"/>
      <rect x="550" y="206" width="350" height="20" rx="10" fill="#8f6a34"/>
      <text x="914" y="221" font-size="14" font-weight="700" fill="#8f6a34">896</text>
      <text x="980" y="221" text-anchor="end" font-size="14" font-weight="700" fill="#171714">16 + 2 shared</text>
    </g>
    <line x1="60" y1="265" x2="980" y2="265" stroke="#ddd8ce"/>

    <text x="60" y="310" font-size="16" font-weight="700" fill="#171714">DeepSeek-V4-Pro</text>
    <text x="60" y="333" font-size="13" fill="#6c6962">61 层 · 四路 mHC 残差流</text>
    <g fill="none" stroke-width="3"><path d="M262 291h220" stroke="#5e5068"/><path d="M262 301h220" stroke="#7b6a86"/><path d="M262 311h220" stroke="#9a8aa3"/><path d="M262 321h220" stroke="#b8aebd"/></g>
    <path d="M316 286l28 40M372 286l28 40M428 286l28 40" stroke="#5e5068" stroke-width="1.5"/>
    <rect x="550" y="295" width="350" height="20" rx="10" fill="#e4ded2"/>
    <rect x="550" y="295" width="150" height="20" rx="10" fill="#5e5068"/>
    <text x="714" y="310" font-size="14" font-weight="700" fill="#5e5068">384</text>
    <text x="980" y="310" text-anchor="end" font-size="14" font-weight="700" fill="#171714">6 + 1 shared</text>
    <line x1="60" y1="354" x2="980" y2="354" stroke="#ddd8ce"/>

    <text x="60" y="399" font-size="16" font-weight="700" fill="#171714">GLM-5.2</text>
    <text x="60" y="422" font-size="13" fill="#6c6962">78 层 · 标准残差主干</text>
    <g fill="#c6d6da"><rect x="262" y="377" width="44" height="44" rx="8"/><rect x="320" y="377" width="44" height="44" rx="8"/><rect x="378" y="377" width="44" height="44" rx="8"/><rect x="436" y="377" width="44" height="44" rx="8"/></g>
    <path d="M284 426h174" stroke="#315a68" stroke-width="2.4"/>
    <rect x="550" y="384" width="350" height="20" rx="10" fill="#e4ded2"/>
    <rect x="550" y="384" width="100" height="20" rx="10" fill="#315a68"/>
    <text x="664" y="399" font-size="14" font-weight="700" fill="#315a68">256</text>
    <text x="980" y="399" text-anchor="end" font-size="14" font-weight="700" fill="#171714">8 + 1 shared</text>
    <line x1="60" y1="443" x2="980" y2="443" stroke="#ddd8ce"/>

    <text x="60" y="488" font-size="16" font-weight="700" fill="#171714">MiniMax M3</text>
    <text x="60" y="511" font-size="13" fill="#6c6962">60 层 · 标准残差主干</text>
    <g fill="#c6d6da"><rect x="262" y="466" width="44" height="44" rx="8"/><rect x="320" y="466" width="44" height="44" rx="8"/><rect x="378" y="466" width="44" height="44" rx="8"/><rect x="436" y="466" width="44" height="44" rx="8"/></g>
    <path d="M284 515h174" stroke="#315a68" stroke-width="2.4"/>
    <rect x="550" y="473" width="350" height="20" rx="10" fill="#e4ded2"/>
    <rect x="550" y="473" width="50" height="20" rx="10" fill="#315a68"/>
    <text x="614" y="488" font-size="14" font-weight="700" fill="#315a68">128</text>
    <text x="980" y="488" text-anchor="end" font-size="14" font-weight="700" fill="#171714">4 + 1 shared</text>
    <line x1="60" y1="532" x2="980" y2="532" stroke="#ddd8ce"/>

    <text x="60" y="577" font-size="16" font-weight="700" fill="#171714">Qwen3.5-397B-A17B</text>
    <text x="60" y="600" font-size="13" fill="#6c6962">60 层 · 标准残差主干</text>
    <g fill="#d9c6a8"><rect x="262" y="555" width="44" height="44" rx="8"/><rect x="320" y="555" width="44" height="44" rx="8"/><rect x="378" y="555" width="44" height="44" rx="8"/><rect x="436" y="555" width="44" height="44" rx="8"/></g>
    <path d="M284 604h174" stroke="#8f6a34" stroke-width="2.4"/>
    <rect x="550" y="562" width="350" height="20" rx="10" fill="#e4ded2"/>
    <rect x="550" y="562" width="200" height="20" rx="10" fill="#8f6a34"/>
    <text x="764" y="577" font-size="14" font-weight="700" fill="#8f6a34">512</text>
    <text x="980" y="577" text-anchor="end" font-size="14" font-weight="700" fill="#171714">10 + 1 shared</text>
  </g>
  <rect x="60" y="630" width="920" height="38" rx="10" fill="#171714"/>
  <text x="80" y="654" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" fill="#d8d3c9">条形长度表示专家总数，Kimi 的 896 作为满刻度；每 token 激活数不含共享专家时按官方配置标注。</text>
  <text x="60" y="689" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" fill="#87847c">EXPERT COUNTS FROM OFFICIAL CONFIGS / REPORTS · DEPTH PATHS ARE SCHEMATIC</text>
</svg>
