<svg xmlns="http://www.w3.org/2000/svg" width="390" height="850" viewBox="0 0 390 850" role="img" aria-labelledby="title desc">
  <title id="title">五种架构的三条长上下文路线，移动版</title>
  <desc id="desc">状态压缩、稀疏检索和多尺度压缩三条路线的纵向对比。</desc>
  <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9d4c8"/></pattern></defs>
  <rect width="390" height="850" fill="#f5f3eb"/><rect width="390" height="850" fill="url(#dots)" opacity=".4"/>
  <text x="24" y="34" font-family="Inter, Noto Sans SC, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8f6a34">ARCHITECTURE MAP · 2026.07</text>
  <text x="24" y="68" font-family="Noto Serif SC, Songti SC, serif" font-size="24" font-weight="700" fill="#171714">五种架构，三条路线</text>
  <text x="24" y="92" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" fill="#68665f">百万 token 进入模型前，历史会被怎样处理？</text>
  <g font-family="Inter, Noto Sans SC, sans-serif">
    <rect x="24" y="122" width="342" height="194" rx="14" fill="#fffdfa" stroke="#c9baa3"/>
    <rect x="24" y="122" width="342" height="48" rx="14" fill="#8f6a34"/><path d="M24 154h342v16H24z" fill="#8f6a34"/>
    <text x="44" y="152" font-family="Noto Serif SC, Songti SC, serif" font-size="19" font-weight="700" fill="#fff">状态压缩</text>
    <text x="44" y="199" font-size="13" font-weight="700" fill="#8f6a34">KIMI K3</text>
    <text x="44" y="222" font-size="16" font-weight="700" fill="#171714">KDA + 周期性 Gated MLA</text>
    <text x="44" y="250" font-size="13" font-weight="700" fill="#8f6a34">QWEN3.5</text>
    <text x="44" y="273" font-size="16" font-weight="700" fill="#171714">DeltaNet × 3 + Full Attention × 1</text>
    <text x="44" y="298" font-size="12" fill="#6b6861">收益：固定状态减少 KV　风险：早期细节被覆盖</text>

    <rect x="24" y="334" width="342" height="194" rx="14" fill="#fffdfa" stroke="#b8c6cc"/>
    <rect x="24" y="334" width="342" height="48" rx="14" fill="#315a68"/><path d="M24 366h342v16H24z" fill="#315a68"/>
    <text x="44" y="364" font-family="Noto Serif SC, Songti SC, serif" font-size="19" font-weight="700" fill="#fff">稀疏检索</text>
    <text x="44" y="411" font-size="13" font-weight="700" fill="#315a68">GLM-5.2</text>
    <text x="44" y="434" font-size="16" font-weight="700" fill="#171714">Top-2048 token，四层共享索引</text>
    <text x="44" y="462" font-size="13" font-weight="700" fill="#315a68">MINIMAX M3</text>
    <text x="44" y="485" font-size="16" font-weight="700" fill="#171714">每个 GQA 组选择 16 个 KV 块</text>
    <text x="44" y="510" font-size="12" fill="#6b6861">收益：读取原始候选　风险：Top-K 漏召回</text>

    <rect x="24" y="546" width="342" height="174" rx="14" fill="#fffdfa" stroke="#c8bdcf"/>
    <rect x="24" y="546" width="342" height="48" rx="14" fill="#5e5068"/><path d="M24 578h342v16H24z" fill="#5e5068"/>
    <text x="44" y="576" font-family="Noto Serif SC, Songti SC, serif" font-size="19" font-weight="700" fill="#fff">多尺度压缩</text>
    <text x="44" y="623" font-size="13" font-weight="700" fill="#5e5068">DEEPSEEK-V4-PRO</text>
    <text x="44" y="648" font-size="15" font-weight="700" fill="#171714">最近 128 token：局部原文</text>
    <text x="44" y="672" font-size="15" font-weight="700" fill="#171714">4:1 CSA 检索 + 128:1 HCA 全局记忆</text>
    <text x="44" y="702" font-size="12" fill="#6b6861">收益：极低 KV　风险：重压缩损失细节</text>
  </g>
  <rect x="24" y="744" width="342" height="70" rx="14" fill="#171714"/>
  <text x="44" y="773" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#fff">共同底层：稀疏 MoE</text>
  <text x="44" y="797" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" fill="#cbc6bc">总参数容量与每 token 激活计算分离</text>
  <text x="24" y="837" font-family="Inter, Noto Sans SC, sans-serif" font-size="9" fill="#87847c">OFFICIAL MODEL CARDS, CONFIGS &amp; REPORTS</text>
</svg>
