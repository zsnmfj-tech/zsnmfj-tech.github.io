<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1120" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc">
  <title id="title">五种长上下文机制，移动版</title>
  <desc id="desc">纵向展示五个模型从历史到注意力输入的处理流程。</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9d4c8"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0l7 3.5L0 7z" fill="#77746c"/></marker>
  </defs>
  <rect width="390" height="1120" fill="#f5f3eb"/><rect width="390" height="1120" fill="url(#dots)" opacity=".4"/>
  <text x="24" y="34" font-family="Inter, Noto Sans SC, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#8f6a34">LONG-CONTEXT MECHANISMS</text>
  <text x="24" y="68" font-family="Noto Serif SC, Songti SC, serif" font-size="23" font-weight="700" fill="#171714">完整历史进入注意力之前</text>
  <text x="24" y="92" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" fill="#68665f">每张卡片都标出压缩位置与主要风险。</text>
  <g font-family="Inter, Noto Sans SC, sans-serif">
    <rect x="24" y="122" width="342" height="174" rx="14" fill="#fffdfa" stroke="#c9baa3"/>
    <text x="44" y="153" font-size="13" font-weight="700" fill="#8f6a34">KIMI K3 · KDA</text>
    <text x="44" y="179" font-size="18" font-weight="700" fill="#171714">固定状态 + 周期性 MLA</text>
    <rect x="44" y="205" width="92" height="34" rx="8" fill="#eee8dd"/><text x="90" y="227" text-anchor="middle" font-size="12" fill="#5d5345">完整历史</text>
    <line x1="136" y1="222" x2="164" y2="222" stroke="#77746c" marker-end="url(#arrow)"/>
    <rect x="172" y="196" width="116" height="52" rx="9" fill="#8f6a34"/><text x="230" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">递归状态</text><text x="230" y="235" text-anchor="middle" font-size="11" fill="#f0e8db">固定大小</text>
    <text x="44" y="274" font-size="12" fill="#6b6861">主要风险：状态更新覆盖早期精确信息</text>

    <rect x="24" y="314" width="342" height="194" rx="14" fill="#fffdfa" stroke="#c8bdcf"/>
    <text x="44" y="345" font-size="13" font-weight="700" fill="#5e5068">DEEPSEEK-V4-PRO</text>
    <text x="44" y="371" font-size="18" font-weight="700" fill="#171714">局部原文 + CSA + HCA</text>
    <rect x="44" y="397" width="95" height="30" rx="7" fill="#e5eef0"/><text x="91" y="417" text-anchor="middle" font-size="11" fill="#304e58">128 原文</text>
    <rect x="149" y="397" width="95" height="30" rx="7" fill="#eee8f0"/><text x="196" y="417" text-anchor="middle" font-size="11" fill="#504358">CSA 4:1</text>
    <rect x="254" y="397" width="92" height="30" rx="7" fill="#5e5068"/><text x="300" y="417" text-anchor="middle" font-size="11" fill="#fff">HCA 128:1</text>
    <text x="44" y="454" font-size="13" font-weight="700" fill="#171714">CSA 选 Top-1024，HCA 读取全部摘要</text>
    <text x="44" y="484" font-size="12" fill="#6b6861">主要风险：压缩条目无法保留逐字细节</text>

    <rect x="24" y="526" width="342" height="174" rx="14" fill="#fffdfa" stroke="#b8c6cc"/>
    <text x="44" y="557" font-size="13" font-weight="700" fill="#315a68">GLM-5.2 · DSA</text>
    <text x="44" y="583" font-size="18" font-weight="700" fill="#171714">token 级稀疏检索</text>
    <rect x="44" y="609" width="92" height="34" rx="8" fill="#e5eef0"/><text x="90" y="631" text-anchor="middle" font-size="12" fill="#304e58">历史 KV</text>
    <line x1="136" y1="626" x2="164" y2="626" stroke="#77746c" marker-end="url(#arrow)"/>
    <rect x="172" y="600" width="116" height="52" rx="9" fill="#315a68"/><text x="230" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Indexer</text><text x="230" y="639" text-anchor="middle" font-size="11" fill="#dfeaec">Top-2048</text>
    <text x="44" y="678" font-size="12" fill="#6b6861">主要风险：候选之外的信息无法恢复</text>

    <rect x="24" y="718" width="342" height="174" rx="14" fill="#fffdfa" stroke="#b8c6cc"/>
    <text x="44" y="749" font-size="13" font-weight="700" fill="#315a68">MINIMAX M3 · MSA</text>
    <text x="44" y="775" font-size="18" font-weight="700" fill="#171714">GQA 组级块检索</text>
    <rect x="44" y="801" width="92" height="34" rx="8" fill="#e5eef0"/><text x="90" y="823" text-anchor="middle" font-size="12" fill="#304e58">128-token 块</text>
    <line x1="136" y1="818" x2="164" y2="818" stroke="#77746c" marker-end="url(#arrow)"/>
    <rect x="172" y="792" width="116" height="52" rx="9" fill="#315a68"/><text x="230" y="813" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Top-16 blocks</text><text x="230" y="831" text-anchor="middle" font-size="11" fill="#dfeaec">原始 KV</text>
    <text x="44" y="870" font-size="12" fill="#6b6861">主要风险：块级漏召回与块内读取浪费</text>

    <rect x="24" y="910" width="342" height="174" rx="14" fill="#fffdfa" stroke="#c9baa3"/>
    <text x="44" y="941" font-size="13" font-weight="700" fill="#8f6a34">QWEN3.5 · DELTANET</text>
    <text x="44" y="967" font-size="18" font-weight="700" fill="#171714">三层递归，一层完整注意力</text>
    <rect x="44" y="993" width="92" height="34" rx="8" fill="#eee8dd"/><text x="90" y="1015" text-anchor="middle" font-size="12" fill="#5d5345">完整历史</text>
    <line x1="136" y1="1010" x2="164" y2="1010" stroke="#77746c" marker-end="url(#arrow)"/>
    <rect x="172" y="984" width="116" height="52" rx="9" fill="#8f6a34"/><text x="230" y="1005" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DeltaNet × 3</text><text x="230" y="1023" text-anchor="middle" font-size="11" fill="#f0e8db">Full Attn × 1</text>
    <text x="44" y="1062" font-size="12" fill="#6b6861">主要风险：递归状态覆盖，专用内核依赖</text>
  </g>
  <text x="24" y="1106" font-family="Inter, Noto Sans SC, sans-serif" font-size="9" fill="#87847c">MECHANISM DIAGRAM · NOT TO SCALE</text>
</svg>
