<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" role="img" aria-labelledby="title desc">
  <title id="title">深度信息流与 MoE 专家配置，移动版</title>
  <desc id="desc">纵向比较五个模型的层数、深度连接和专家激活配置。</desc>
  <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9d4c8"/></pattern></defs>
  <rect width="390" height="980" fill="#f5f3eb"/><rect width="390" height="980" fill="url(#dots)" opacity=".4"/>
  <text x="24" y="34" font-family="Inter, Noto Sans SC, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8f6a34">DEPTH × EXPERT SPACE</text>
  <text x="24" y="68" font-family="Noto Serif SC, Songti SC, serif" font-size="23" font-weight="700" fill="#171714">扩展不只发生在序列长度</text>
  <text x="24" y="92" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" fill="#68665f">条形以 Kimi 的 896 个路由专家为满刻度。</text>
  <g font-family="Inter, Noto Sans SC, sans-serif">
    <rect x="24" y="122" width="342" height="146" rx="14" fill="#fffdfa" stroke="#c9baa3"/>
    <text x="44" y="153" font-size="17" font-weight="700" fill="#171714">Kimi K3</text>
    <text x="44" y="178" font-size="12" fill="#6b6861">93 层 · AttnRes 跨块读取</text>
    <rect x="44" y="200" width="282" height="18" rx="9" fill="#e4ded2"/><rect x="44" y="200" width="282" height="18" rx="9" fill="#8f6a34"/>
    <text x="44" y="244" font-size="13" font-weight="700" fill="#8f6a34">896 experts　每 token：16 + 2 shared</text>

    <rect x="24" y="286" width="342" height="146" rx="14" fill="#fffdfa" stroke="#c8bdcf"/>
    <text x="44" y="317" font-size="17" font-weight="700" fill="#171714">DeepSeek-V4-Pro</text>
    <text x="44" y="342" font-size="12" fill="#6b6861">61 层 · 四路 mHC 残差流</text>
    <rect x="44" y="364" width="282" height="18" rx="9" fill="#e4ded2"/><rect x="44" y="364" width="121" height="18" rx="9" fill="#5e5068"/>
    <text x="44" y="408" font-size="13" font-weight="700" fill="#5e5068">384 experts　每 token：6 + 1 shared</text>

    <rect x="24" y="450" width="342" height="146" rx="14" fill="#fffdfa" stroke="#b8c6cc"/>
    <text x="44" y="481" font-size="17" font-weight="700" fill="#171714">GLM-5.2</text>
    <text x="44" y="506" font-size="12" fill="#6b6861">78 层 · 标准残差主干</text>
    <rect x="44" y="528" width="282" height="18" rx="9" fill="#e4ded2"/><rect x="44" y="528" width="81" height="18" rx="9" fill="#315a68"/>
    <text x="44" y="572" font-size="13" font-weight="700" fill="#315a68">256 experts　每 token：8 + 1 shared</text>

    <rect x="24" y="614" width="342" height="146" rx="14" fill="#fffdfa" stroke="#b8c6cc"/>
    <text x="44" y="645" font-size="17" font-weight="700" fill="#171714">MiniMax M3</text>
    <text x="44" y="670" font-size="12" fill="#6b6861">60 层 · 标准残差主干</text>
    <rect x="44" y="692" width="282" height="18" rx="9" fill="#e4ded2"/><rect x="44" y="692" width="40" height="18" rx="9" fill="#315a68"/>
    <text x="44" y="736" font-size="13" font-weight="700" fill="#315a68">128 experts　每 token：4 + 1 shared</text>

    <rect x="24" y="778" width="342" height="146" rx="14" fill="#fffdfa" stroke="#c9baa3"/>
    <text x="44" y="809" font-size="17" font-weight="700" fill="#171714">Qwen3.5-397B-A17B</text>
    <text x="44" y="834" font-size="12" fill="#6b6861">60 层 · 标准残差主干</text>
    <rect x="44" y="856" width="282" height="18" rx="9" fill="#e4ded2"/><rect x="44" y="856" width="161" height="18" rx="9" fill="#8f6a34"/>
    <text x="44" y="900" font-size="13" font-weight="700" fill="#8f6a34">512 experts　每 token：10 + 1 shared</text>
  </g>
  <rect x="24" y="942" width="342" height="24" rx="12" fill="#171714"/>
  <text x="195" y="958" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="10" fill="#d8d3c9">总专家数决定容量，激活专家数影响单 token 计算</text>
</svg>
