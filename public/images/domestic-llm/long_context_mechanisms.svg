<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="780" viewBox="0 0 1040 780" role="img" aria-labelledby="title desc">
  <title id="title">五种长上下文机制</title>
  <desc id="desc">展示 Kimi K3、DeepSeek-V4-Pro、GLM-5.2、MiniMax M3 与 Qwen3.5 从完整历史到实际注意力输入的处理链路。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dfdbd0" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#77746c"/></marker>
  </defs>
  <rect width="1040" height="780" fill="#f6f4ed"/>
  <rect width="1040" height="780" fill="url(#grid)" opacity=".34"/>
  <text x="60" y="48" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#8f6a34">LONG-CONTEXT MECHANISMS</text>
  <text x="60" y="89" font-family="Noto Serif SC, Songti SC, serif" font-size="32" font-weight="700" fill="#171714">完整历史进入注意力之前，发生了什么</text>
  <text x="60" y="118" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#67655f">每一行都从百万 token 历史出发，终点是当前查询真正会计算或读取的内容。</text>
  <g font-family="Inter, Noto Sans SC, sans-serif">
    <rect x="60" y="154" width="920" height="104" rx="14" fill="#fffdfa" stroke="#d7cec0"/>
    <rect x="60" y="272" width="920" height="104" rx="14" fill="#fffdfa" stroke="#d7cec0"/>
    <rect x="60" y="390" width="920" height="104" rx="14" fill="#fffdfa" stroke="#d7cec0"/>
    <rect x="60" y="508" width="920" height="104" rx="14" fill="#fffdfa" stroke="#d7cec0"/>
    <rect x="60" y="626" width="920" height="104" rx="14" fill="#fffdfa" stroke="#d7cec0"/>

    <text x="84" y="184" font-size="15" font-weight="700" fill="#8f6a34">KIMI K3</text>
    <text x="84" y="211" font-size="19" font-weight="700" fill="#181815">KDA 固定状态</text>
    <text x="84" y="235" font-size="13" fill="#6b6861">间歇 Gated MLA 回看全局</text>
    <rect x="278" y="181" width="132" height="42" rx="10" fill="#eee8dd"/><text x="344" y="207" text-anchor="middle" font-size="14" fill="#4e4b45">完整 token 流</text>
    <line x1="410" y1="202" x2="460" y2="202" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="468" y="172" width="156" height="60" rx="12" fill="#8f6a34"/><text x="546" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">递归状态更新</text><text x="546" y="218" text-anchor="middle" font-size="12" fill="#f0e8db">固定大小</text>
    <line x1="624" y1="202" x2="674" y2="202" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="682" y="181" width="146" height="42" rx="10" fill="#e6edf0"/><text x="755" y="207" text-anchor="middle" font-size="14" fill="#304e58">周期性 MLA</text>
    <text x="954" y="198" text-anchor="end" font-size="12" font-weight="700" fill="#8f6a34">状态覆盖</text><text x="954" y="218" text-anchor="end" font-size="12" fill="#6b6861">主要风险</text>

    <text x="84" y="302" font-size="15" font-weight="700" fill="#5e5068">DEEPSEEK-V4-PRO</text>
    <text x="84" y="329" font-size="19" font-weight="700" fill="#181815">三种历史粒度</text>
    <text x="84" y="353" font-size="13" fill="#6b6861">局部原文 + CSA + HCA</text>
    <rect x="278" y="287" width="120" height="28" rx="8" fill="#e7ecee"/><text x="338" y="306" text-anchor="middle" font-size="12" fill="#304e58">最近 128 原文</text>
    <rect x="278" y="322" width="120" height="28" rx="8" fill="#eee8f0"/><text x="338" y="341" text-anchor="middle" font-size="12" fill="#504358">CSA 4:1</text>
    <rect x="278" y="357" width="120" height="10" rx="5" fill="#5e5068"/>
    <line x1="410" y1="320" x2="460" y2="320" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="468" y="290" width="156" height="60" rx="12" fill="#5e5068"/><text x="546" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">CSA Top-1024</text><text x="546" y="336" text-anchor="middle" font-size="12" fill="#ece6ef">HCA 全局密集</text>
    <line x1="624" y1="320" x2="674" y2="320" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="682" y="299" width="146" height="42" rx="10" fill="#eee8f0"/><text x="755" y="325" text-anchor="middle" font-size="14" fill="#504358">异构 KV 输入</text>
    <text x="954" y="316" text-anchor="end" font-size="12" font-weight="700" fill="#5e5068">压缩损失</text><text x="954" y="336" text-anchor="end" font-size="12" fill="#6b6861">主要风险</text>

    <text x="84" y="420" font-size="15" font-weight="700" fill="#315a68">GLM-5.2</text>
    <text x="84" y="447" font-size="19" font-weight="700" fill="#181815">token 级稀疏检索</text>
    <text x="84" y="471" font-size="13" fill="#6b6861">四层共享一次索引结果</text>
    <rect x="278" y="417" width="132" height="42" rx="10" fill="#e5eef0"/><text x="344" y="443" text-anchor="middle" font-size="14" fill="#304e58">历史 KV 条目</text>
    <line x1="410" y1="438" x2="460" y2="438" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="468" y="408" width="156" height="60" rx="12" fill="#315a68"/><text x="546" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Indexer</text><text x="546" y="454" text-anchor="middle" font-size="12" fill="#dfeaec">Top-2048 token</text>
    <line x1="624" y1="438" x2="674" y2="438" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="682" y="417" width="146" height="42" rx="10" fill="#e5eef0"/><text x="755" y="443" text-anchor="middle" font-size="14" fill="#304e58">核心注意力</text>
    <text x="954" y="434" text-anchor="end" font-size="12" font-weight="700" fill="#315a68">漏召回</text><text x="954" y="454" text-anchor="end" font-size="12" fill="#6b6861">主要风险</text>

    <text x="84" y="538" font-size="15" font-weight="700" fill="#315a68">MINIMAX M3</text>
    <text x="84" y="565" font-size="19" font-weight="700" fill="#181815">GQA 组级块检索</text>
    <text x="84" y="589" font-size="13" fill="#6b6861">保留被选块的原始 KV</text>
    <g fill="#e5eef0"><rect x="278" y="535" width="28" height="42" rx="5"/><rect x="312" y="535" width="28" height="42" rx="5"/><rect x="346" y="535" width="28" height="42" rx="5"/><rect x="380" y="535" width="28" height="42" rx="5"/></g>
    <line x1="410" y1="556" x2="460" y2="556" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="468" y="526" width="156" height="60" rx="12" fill="#315a68"/><text x="546" y="551" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Top-16 blocks</text><text x="546" y="572" text-anchor="middle" font-size="12" fill="#dfeaec">128 token / block</text>
    <line x1="624" y1="556" x2="674" y2="556" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="682" y="535" width="146" height="42" rx="10" fill="#e5eef0"/><text x="755" y="561" text-anchor="middle" font-size="14" fill="#304e58">原始 KV 注意力</text>
    <text x="954" y="552" text-anchor="end" font-size="12" font-weight="700" fill="#315a68">块内浪费</text><text x="954" y="572" text-anchor="end" font-size="12" fill="#6b6861">主要风险</text>

    <text x="84" y="656" font-size="15" font-weight="700" fill="#8f6a34">QWEN3.5</text>
    <text x="84" y="683" font-size="19" font-weight="700" fill="#181815">3:1 混合注意力</text>
    <text x="84" y="707" font-size="13" fill="#6b6861">DeltaNet + Gated GQA</text>
    <rect x="278" y="653" width="132" height="42" rx="10" fill="#eee8dd"/><text x="344" y="679" text-anchor="middle" font-size="14" fill="#6f5129">完整 token 流</text>
    <line x1="410" y1="674" x2="460" y2="674" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="468" y="644" width="156" height="60" rx="12" fill="#8f6a34"/><text x="546" y="669" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">DeltaNet × 3</text><text x="546" y="690" text-anchor="middle" font-size="12" fill="#f0e8db">固定矩阵状态</text>
    <line x1="624" y1="674" x2="674" y2="674" stroke="#77746c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="682" y="653" width="146" height="42" rx="10" fill="#eee8dd"/><text x="755" y="679" text-anchor="middle" font-size="14" fill="#6f5129">Full Attention × 1</text>
    <text x="954" y="670" text-anchor="end" font-size="12" font-weight="700" fill="#8f6a34">状态覆盖</text><text x="954" y="690" text-anchor="end" font-size="12" fill="#6b6861">主要风险</text>
  </g>
  <text x="60" y="758" font-family="Inter, Noto Sans SC, sans-serif" font-size="12" fill="#87847c">MECHANISM DIAGRAM · NOT TO SCALE · BASED ON OFFICIAL CONFIGURATIONS</text>
</svg>
