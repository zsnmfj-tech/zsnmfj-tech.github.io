<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">海外客诉处理流程</title>
  <desc id="desc">海外客户、服务人员、Agent、质量团队和业务系统共同完成客诉信息补全、证据关联、人工决策与结果写回。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.label{font-size:15px;fill:#986b2e;font-weight:700}.node{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="960" height="760" fill="#f6f2e9"/><text x="36" y="38" class="label">04 / 场景推演</text><text x="36" y="82" class="title">一张海外客诉如何变成可执行任务</text><text x="36" y="114" class="small">Agent 组织信息和证据，员工确认判断，业务系统保存事实与任务状态。</text>
  <g transform="translate(36 154)"><rect width="272" height="200" rx="10" fill="#fffdf8" stroke="#c7beae"/><text x="20" y="32" class="label">1　海外客户 / 服务入口</text><text x="20" y="68" class="node">建立客诉工单</text><text x="20" y="104" class="body">故障描述 · 现场照片</text><text x="20" y="132" class="body">产品序列号 · 联系信息</text><rect x="20" y="156" width="232" height="28" rx="14" fill="#f0e3ca"/><text x="136" y="175" text-anchor="middle" class="small">资料不足时继续追问</text></g>
  <path d="M310 254H330" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(344 154)"><rect width="272" height="200" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="32" class="label">2　Agent</text><text x="20" y="68" class="node">整理语言与字段</text><text x="20" y="104" class="body">翻译并分类客户描述</text><text x="20" y="132" class="body">识别缺失资料和产品信息</text><rect x="20" y="156" width="232" height="28" rx="14" fill="#fffdf8"/><text x="136" y="175" text-anchor="middle" class="small">不在信息不足时猜原因</text></g>
  <path d="M618 254H638" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(652 154)"><rect width="272" height="200" rx="10" fill="#dce8e5" stroke="#c7beae"/><text x="20" y="32" class="label">3　业务系统</text><text x="20" y="68" class="node">返回当前业务事实</text><text x="20" y="104" class="body">CRM · QMS · MES</text><text x="20" y="132" class="body">保修 · 批次 · 检测 · 库存</text><rect x="20" y="156" width="232" height="28" rx="14" fill="#fffdf8"/><text x="136" y="175" text-anchor="middle" class="small">精确字段由规则校验</text></g>
  <path d="M788 358V393H788M788 393H788" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(652 408)"><rect width="272" height="200" rx="10" fill="#f0e3ca" stroke="#c7beae"/><text x="20" y="32" class="label">4　Agent</text><text x="20" y="68" class="node">组织证据与假设</text><text x="20" y="104" class="body">检索手册和相似案例</text><text x="20" y="132" class="body">列出原因假设与证据缺口</text><rect x="20" y="156" width="232" height="28" rx="14" fill="#fffdf8"/><text x="136" y="175" text-anchor="middle" class="small">输出待验证的处理选项</text></g>
  <path d="M650 508H630" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(344 408)"><rect width="272" height="200" rx="10" fill="#1b3654"/><text x="20" y="32" class="label" fill="#d3ad75">5　质量 / 服务人员</text><text x="20" y="68" class="node white">确认调查和客户方案</text><text x="20" y="104" class="body white">核对证据与调查范围</text><text x="20" y="132" class="body white">批准维修、补件或返厂</text><rect x="20" y="156" width="232" height="28" rx="14" fill="#fffdf8"/><text x="136" y="175" text-anchor="middle" class="small">人承担最终业务判断</text></g>
  <path d="M342 508H322" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(36 408)"><rect width="272" height="200" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="32" class="label">6　业务系统 / Agent</text><text x="20" y="68" class="node">建单、写回与反馈</text><text x="20" y="104" class="body">更新服务和质量任务</text><text x="20" y="132" class="body">记录处理结果与人工修改</text><rect x="20" y="156" width="232" height="28" rx="14" fill="#fffdf8"/><text x="136" y="175" text-anchor="middle" class="small">失败样本进入评测集</text></g>
  <rect x="36" y="650" width="888" height="58" rx="9" fill="#fffdf8" stroke="#c7beae"/><text x="60" y="686" class="node">观察指标：证据取得时间　资料完整度　转派次数　处理周期　同类问题复发</text>
  <text x="36" y="742" class="small">方案推演，非材料中披露的已交付客户项目</text>
</svg>
