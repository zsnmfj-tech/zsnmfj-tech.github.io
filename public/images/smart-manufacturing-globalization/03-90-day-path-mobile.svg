<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1200" viewBox="0 0 390 1200" role="img" aria-labelledby="title desc">
  <title id="title">制造业 AI 项目 90 天验证路径</title><desc id="desc">四个阶段依次验证业务价值、方案可行性、风险边界和扩大条件。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.node{font-size:18px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="390" height="1200" fill="#f6f2e9"/><text x="22" y="32" class="label">03 / 90 天验证</text><text x="22" y="69" class="title">每个阶段都留下</text><text x="22" y="101" class="title">继续投入的依据</text>
  <g transform="translate(22 138)"><rect width="346" height="200" rx="10" fill="#fffdf8" stroke="#c7beae"/><text x="20" y="31" class="label">第 1—15 天</text><text x="20" y="63" class="node">问题与基线</text><text x="20" y="99" class="body">跟踪任务，记录等待、返工和成本</text><text x="20" y="127" class="body">确定业务负责人和基线指标</text><rect x="20" y="151" width="306" height="30" rx="15" fill="#f0e3ca"/><text x="173" y="171" text-anchor="middle" class="small">决策：这件事值得解决吗</text></g><path d="M195 340V361" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 372)"><rect width="346" height="200" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="31" class="label">第 16—30 天</text><text x="20" y="63" class="node">方案与原型</text><text x="20" y="99" class="body">明确数据、工具、权限和人工节点</text><text x="20" y="127" class="body">用历史样本验证正常与异常路径</text><rect x="20" y="151" width="306" height="30" rx="15" fill="#fffdf8"/><text x="173" y="171" text-anchor="middle" class="small">决策：这套方案可行吗</text></g><path d="M195 574V595" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 606)"><rect width="346" height="200" rx="10" fill="#f0e3ca" stroke="#c7beae"/><text x="20" y="31" class="label">第 31—60 天</text><text x="20" y="63" class="node">受控试运行</text><text x="20" y="99" class="body">限定区域、产品或团队运行</text><text x="20" y="127" class="body">保留日志、人工修改和异常记录</text><rect x="20" y="151" width="306" height="30" rx="15" fill="#fffdf8"/><text x="173" y="171" text-anchor="middle" class="small">决策：运行风险可控吗</text></g><path d="M195 808V829" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 840)"><rect width="346" height="210" rx="10" fill="#1b3654"/><text x="20" y="31" class="label" fill="#d3ad75">第 61—90 天</text><text x="20" y="63" class="node white">验证与决策</text><text x="20" y="99" class="body white">比较前后流程并计算维护成本</text><text x="20" y="127" class="body white">决定继续、调整范围或停止投入</text><rect x="20" y="159" width="306" height="30" rx="15" fill="#fffdf8"/><text x="173" y="179" text-anchor="middle" class="small">决策：下一轮扩大到哪里</text></g>
  <rect x="22" y="1084" width="346" height="70" rx="9" fill="#dce8e5"/><text x="42" y="1115" class="node">交付一段经过业务验证</text><text x="42" y="1141" class="body">并且可以继续运行的工作流程</text>
  <text x="22" y="1183" class="small">基于活动分享整理</text>
</svg>
