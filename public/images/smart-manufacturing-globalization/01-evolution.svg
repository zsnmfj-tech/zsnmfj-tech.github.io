<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">制造企业从信息化、数字化到智能化的能力演进</title>
  <desc id="desc">信息化记录业务事实，数字化关联数据并看见状态，智能化识别异常、组织证据并推动处置。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.label{font-size:15px;fill:#986b2e;font-weight:700}.node{font-size:22px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="960" height="600" fill="#f6f2e9"/>
  <text x="36" y="38" class="label">01 / 能力演进</text>
  <text x="36" y="82" class="title">数据已经进入系统，响应仍要继续向前</text>
  <text x="36" y="114" class="small">每个阶段保留上一阶段的能力，再减少一段依赖人工查找、判断和协调的工作。</text>

  <g transform="translate(36 158)">
    <rect width="264" height="268" rx="12" fill="#fffdf8" stroke="#c7beae"/>
    <text x="24" y="38" class="label">第一阶段</text><text x="24" y="78" class="node">信息化：记录事实</text>
    <line x1="24" y1="98" x2="240" y2="98" stroke="#d6cfc3"/>
    <text x="24" y="132" class="body">ERP · MES · CRM · 质量系统</text>
    <text x="24" y="170" class="body">订单、生产、检验、库存</text>
    <text x="24" y="202" class="body">和客户活动有了记录</text>
    <rect x="24" y="224" width="216" height="28" rx="14" fill="#f0e3ca"/><text x="132" y="243" text-anchor="middle" class="small">人跨系统查找信息</text>
  </g>
  <path d="M304 292H332" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(348 158)">
    <rect width="264" height="268" rx="12" fill="#e7edf1" stroke="#c7beae"/>
    <text x="24" y="38" class="label">第二阶段</text><text x="24" y="78" class="node">数字化：看见状态</text>
    <line x1="24" y1="98" x2="240" y2="98" stroke="#b9c6ce"/>
    <text x="24" y="132" class="body">关联系统数据与设备信号</text>
    <text x="24" y="170" class="body">通过看板与监控发现变化</text>
    <text x="24" y="202" class="body">管理者获得统一经营视图</text>
    <rect x="24" y="224" width="216" height="28" rx="14" fill="#fffdf8"/><text x="132" y="243" text-anchor="middle" class="small">人解释异常并协调处置</text>
  </g>
  <path d="M616 292H644" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(660 158)">
    <rect width="264" height="268" rx="12" fill="#1b3654"/>
    <text x="24" y="38" class="label" fill="#d3ad75">第三阶段</text><text x="24" y="78" class="node white">智能化：推动处置</text>
    <line x1="24" y1="98" x2="240" y2="98" stroke="#657586"/>
    <text x="24" y="132" class="body white">识别跨系统异常</text>
    <text x="24" y="170" class="body white">组织证据与行动选项</text>
    <text x="24" y="202" class="body white">经授权调用工具并写回结果</text>
    <rect x="24" y="224" width="216" height="28" rx="14" fill="#fffdf8"/><text x="132" y="243" text-anchor="middle" class="small">人处理例外与高影响决定</text>
  </g>

  <rect x="36" y="470" width="888" height="72" rx="10" fill="#dce8e5"/>
  <text x="60" y="501" class="label">同一条业务链</text>
  <text x="60" y="527" class="body">记录发生了什么　→　看见现在怎样　→　判断为什么异常　→　决定由谁采取什么行动</text>
  <text x="36" y="580" class="small">作者根据《AI 驱动企业从数字化迈向智能化出海转型分享》整理</text>
</svg>
