<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">制造业 AI 项目 90 天验证路径</title>
  <desc id="desc">项目依次完成问题与基线、方案与原型、受控试运行、效果验证和下一轮决策。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.label{font-size:15px;fill:#986b2e;font-weight:700}.node{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="960" height="620" fill="#f6f2e9"/>
  <text x="36" y="38" class="label">03 / 90 天验证</text><text x="36" y="82" class="title">每个阶段都要留下继续投入的依据</text><text x="36" y="114" class="small">90 天用于验证一段业务是否改善，时间安排为作者结合分享方法所作的项目建议。</text>
  <line x1="92" y1="194" x2="868" y2="194" stroke="#657586" stroke-width="3"/>
  <circle cx="146" cy="194" r="12" fill="#986b2e"/><circle cx="370" cy="194" r="12" fill="#986b2e"/><circle cx="594" cy="194" r="12" fill="#986b2e"/><circle cx="818" cy="194" r="12" fill="#986b2e"/>
  <g transform="translate(36 230)"><rect width="212" height="244" rx="10" fill="#fffdf8" stroke="#c7beae"/><text x="20" y="34" class="label">第 1—15 天</text><text x="20" y="68" class="node">问题与基线</text><line x1="20" y1="86" x2="192" y2="86" stroke="#d6cfc3"/><text x="20" y="119" class="body">跟踪真实任务</text><text x="20" y="149" class="body">记录等待、返工与成本</text><text x="20" y="179" class="body">确定业务负责人</text><rect x="20" y="200" width="172" height="28" rx="14" fill="#f0e3ca"/><text x="106" y="219" text-anchor="middle" class="small">决策：值得解决吗</text></g>
  <g transform="translate(260 230)"><rect width="212" height="244" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="34" class="label">第 16—30 天</text><text x="20" y="68" class="node">方案与原型</text><line x1="20" y1="86" x2="192" y2="86" stroke="#b9c6ce"/><text x="20" y="119" class="body">明确数据与工具</text><text x="20" y="149" class="body">划定权限和人工节点</text><text x="20" y="179" class="body">用历史样本测试</text><rect x="20" y="200" width="172" height="28" rx="14" fill="#fffdf8"/><text x="106" y="219" text-anchor="middle" class="small">决策：方案可行吗</text></g>
  <g transform="translate(484 230)"><rect width="212" height="244" rx="10" fill="#f0e3ca" stroke="#c7beae"/><text x="20" y="34" class="label">第 31—60 天</text><text x="20" y="68" class="node">受控试运行</text><line x1="20" y1="86" x2="192" y2="86" stroke="#d6c7a8"/><text x="20" y="119" class="body">限定区域或产品线</text><text x="20" y="149" class="body">保留日志与人工修改</text><text x="20" y="179" class="body">处理全部异常</text><rect x="20" y="200" width="172" height="28" rx="14" fill="#fffdf8"/><text x="106" y="219" text-anchor="middle" class="small">决策：风险可控吗</text></g>
  <g transform="translate(708 230)"><rect width="216" height="244" rx="10" fill="#1b3654"/><text x="20" y="34" class="label" fill="#d3ad75">第 61—90 天</text><text x="20" y="68" class="node white">验证与决策</text><line x1="20" y1="86" x2="196" y2="86" stroke="#657586"/><text x="20" y="119" class="body white">比较前后流程</text><text x="20" y="149" class="body white">计算维护成本</text><text x="20" y="179" class="body white">决定继续、调整或停止</text><rect x="20" y="200" width="176" height="28" rx="14" fill="#fffdf8"/><text x="108" y="219" text-anchor="middle" class="small">决策：扩大到哪里</text></g>
  <rect x="36" y="514" width="888" height="54" rx="9" fill="#dce8e5"/><text x="60" y="547" class="node">交付物不是一个 Agent，而是一段经过业务验证、可以继续运行的工作流程</text>
  <text x="36" y="603" class="small">基于分享中的六步方法和 90 天项目单元整理</text>
</svg>
