<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1420" viewBox="0 0 390 1420" role="img" aria-labelledby="title desc">
  <title id="title">海外客诉处理流程</title><desc id="desc">海外客诉从受理、资料补全、证据关联、人工决策到结果写回的六步流程。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.node{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="390" height="1420" fill="#f6f2e9"/><text x="22" y="32" class="label">04 / 场景推演</text><text x="22" y="69" class="title">一张海外客诉如何</text><text x="22" y="101" class="title">变成可执行任务</text>
  <g transform="translate(22 138)"><rect width="346" height="164" rx="10" fill="#fffdf8" stroke="#c7beae"/><text x="20" y="31" class="label">1　海外客户 / 服务入口</text><text x="20" y="62" class="node">建立客诉工单</text><text x="20" y="96" class="body">故障描述 · 照片 · 序列号 · 联系信息</text><text x="20" y="128" class="small">资料不足时由服务人员继续追问</text></g><path d="M195 304V325" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 336)"><rect width="346" height="164" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="31" class="label">2　Agent</text><text x="20" y="62" class="node">整理语言与字段</text><text x="20" y="96" class="body">翻译描述，识别缺失资料和产品信息</text><text x="20" y="128" class="small">不在信息不足时猜测故障原因</text></g><path d="M195 502V523" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 534)"><rect width="346" height="164" rx="10" fill="#dce8e5" stroke="#c7beae"/><text x="20" y="31" class="label">3　业务系统</text><text x="20" y="62" class="node">返回当前业务事实</text><text x="20" y="96" class="body">保修 · 批次 · 检测 · 历史维修 · 库存</text><text x="20" y="128" class="small">序列号和批次由确定性规则校验</text></g><path d="M195 700V721" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 732)"><rect width="346" height="164" rx="10" fill="#f0e3ca" stroke="#c7beae"/><text x="20" y="31" class="label">4　Agent</text><text x="20" y="62" class="node">组织证据与待验证假设</text><text x="20" y="96" class="body">检索手册和案例，列出证据缺口</text><text x="20" y="128" class="small">给出可选处理方式和依据</text></g><path d="M195 898V919" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 930)"><rect width="346" height="174" rx="10" fill="#1b3654"/><text x="20" y="31" class="label" fill="#d3ad75">5　质量 / 服务人员</text><text x="20" y="62" class="node white">确认调查和客户方案</text><text x="20" y="96" class="body white">核对证据、调查范围与客户影响</text><text x="20" y="128" class="body white">批准维修、补件或返厂</text><text x="20" y="154" class="small white">人承担最终业务判断</text></g><path d="M195 1106V1127" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 1138)"><rect width="346" height="164" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="31" class="label">6　业务系统 / Agent</text><text x="20" y="62" class="node">建单、写回与反馈</text><text x="20" y="96" class="body">更新服务和质量任务，记录处理结果</text><text x="20" y="128" class="small">人工修改和失败样本进入评测集</text></g>
  <rect x="22" y="1334" width="346" height="52" rx="9" fill="#fffdf8" stroke="#c7beae"/><text x="42" y="1366" class="body">指标：取证时间 · 完整度 · 转派 · 周期 · 复发</text>
  <text x="22" y="1406" class="small">方案推演，非已披露的客户项目</text>
</svg>
