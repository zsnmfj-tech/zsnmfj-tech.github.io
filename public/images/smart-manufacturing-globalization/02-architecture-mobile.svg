<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1320" viewBox="0 0 390 1320" role="img" aria-labelledby="title desc">
  <title id="title">制造企业出海 AI 参考架构</title><desc id="desc">交互、智能体治理、业务系统工具和数据安全四层架构。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.node{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="390" height="1320" fill="#f6f2e9"/><text x="22" y="32" class="label">02 / 参考架构</text><text x="22" y="69" class="title">Agent 位于员工</text><text x="22" y="101" class="title">和业务系统之间</text>
  <g transform="translate(22 140)"><rect width="346" height="128" rx="10" fill="#fffdf8" stroke="#c7beae"/><text x="20" y="31" class="label">员工与客户交互</text><text x="20" y="63" class="node">服务台 · 质量工作台</text><text x="20" y="91" class="body">供应链协同 · 对话入口</text><text x="20" y="114" class="small">任务、证据、审批与结果</text></g><path d="M195 270V291" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 302)"><rect width="346" height="158" rx="10" fill="#f0e3ca" stroke="#c7beae"/><text x="20" y="31" class="label">智能体编排与治理</text><text x="20" y="63" class="node">组装上下文，选择模型和工具</text><text x="20" y="96" class="body">知识检索 · 人工审批 · 异常升级</text><text x="20" y="124" class="body">运行日志 · 效果评估</text></g><path d="M195 462V483" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 494)"><rect width="346" height="136" rx="10" fill="#e7edf1" stroke="#c7beae"/><text x="20" y="31" class="label">业务系统与工具</text><text x="20" y="63" class="node">ERP · MES · QMS · WMS</text><text x="20" y="93" class="body">物流 · CRM · 知识库</text><text x="20" y="118" class="small">查询、校验、建单和写回</text></g><path d="M195 632V653" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(22 664)"><rect width="346" height="136" rx="10" fill="#dce8e5" stroke="#c7beae"/><text x="20" y="31" class="label">数据与安全基础</text><text x="20" y="63" class="node">订单 · 库存 · 生产 · 质量</text><text x="20" y="93" class="body">设备与服务数据</text><text x="20" y="118" class="small">来源、版本、区域和保存期限</text></g>
  <g transform="translate(22 838)"><rect width="346" height="404" rx="10" fill="#1b3654"/><text x="20" y="34" class="label" fill="#d3ad75">贯穿全程</text><text x="20" y="68" class="node white">运行控制</text><line x1="20" y1="88" x2="326" y2="88" stroke="#657586"/><circle cx="30" cy="124" r="6" fill="#b88a49"/><text x="48" y="129" class="body white">独立身份与最小权限</text><circle cx="30" cy="166" r="6" fill="#b88a49"/><text x="48" y="171" class="body white">敏感信息过滤</text><circle cx="30" cy="208" r="6" fill="#b88a49"/><text x="48" y="213" class="body white">工具白名单</text><circle cx="30" cy="250" r="6" fill="#b88a49"/><text x="48" y="255" class="body white">操作与审批记录</text><circle cx="30" cy="292" r="6" fill="#b88a49"/><text x="48" y="297" class="body white">评测与回归</text><text x="20" y="348" class="small white">总部、区域与工厂根据数据和业务边界</text><text x="20" y="370" class="small white">分配访问范围与执行能力</text></g>
  <text x="22" y="1298" class="small">作者根据活动分享整理并扩展</text>
</svg>
