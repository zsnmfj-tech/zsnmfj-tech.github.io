<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770" role="img" aria-labelledby="t d">
  <title id="t">推演中的未来企业软件架构</title>
  <desc id="d">人站在最上层负责目标、判断、审批与异常处理；向下是岗位 Agent 组成的 AI Workforce；Agent Control Plane 统一调度注册、权限、沙箱与评估；模型、记忆、技能成为可替换底座；最底层是 ERP、CRM、OA 等企业系统，最终产出业务结果。</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9d4c8"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6d6a62"/></marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#8f6a34"/></marker>
  </defs>
  <rect width="1040" height="770" fill="#f5f3eb"/>
  <rect width="1040" height="770" fill="url(#paper)" opacity=".38"/>
  <text x="58" y="50" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#8f6a34">TARGET ARCHITECTURE</text>
  <text x="58" y="92" font-family="Noto Serif SC, Songti SC, serif" font-size="32" font-weight="700" fill="#171714">人在最上层，模型在底座</text>
  <text x="58" y="122" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="15" fill="#69665f">目标下行、结果上行；Control Plane 统一调度权限与评估。</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <circle cx="520" cy="190" r="52" fill="#171714"/>
    <circle cx="520" cy="176" r="10" fill="none" stroke="#f5f3eb" stroke-width="2"/>
    <path d="M502 210c4-13 10-19 18-19s14 6 18 19" fill="none" stroke="#f5f3eb" stroke-width="2"/>
    <text x="520" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f3eb">人</text>
    <text x="610" y="180" font-size="12" font-weight="700" fill="#57534a">目标 · 判断 · 审批 · 异常处理</text>
    <text x="610" y="198" font-size="10.5" fill="#8a857b">把人的判断集中到最关键的节点</text>

    <path d="M470 250v26" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="460" y="268" text-anchor="end" font-size="10.5" fill="#8a857b">目标下行</text>
    <path d="M570 282v-26" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="580" y="268" font-size="10.5" fill="#8a857b">结果上行</text>

    <rect x="220" y="288" width="600" height="78" rx="12" fill="#ebe7da" stroke="#c8c0b3"/>
    <text x="240" y="312" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8a857b">AI WORKFORCE · 岗位 AGENT 编队</text>
    <rect x="240" y="324" width="130" height="32" rx="16" fill="#171714"/>
    <text x="305" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f1">销售 Agent</text>
    <rect x="383" y="324" width="130" height="32" rx="16" fill="#171714"/>
    <text x="448" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f1">财务 Agent</text>
    <rect x="526" y="324" width="130" height="32" rx="16" fill="#171714"/>
    <text x="591" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f1">开发 Agent</text>
    <rect x="669" y="324" width="130" height="32" rx="16" fill="#171714"/>
    <text x="734" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f1">风控 Agent</text>

    <path d="M520 366v30" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="220" y="398" width="600" height="86" rx="12" fill="#e3ecf4" stroke="#1a5d92" stroke-width="1.8"/>
    <text x="244" y="426" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#1a5d92">AGENT CONTROL PLANE</text>
    <text x="244" y="450" font-size="11.5" fill="#33586e">注册 · 模型路由 · 任务调度 · 权限 · 沙箱 · 可观测 · 评估 · 人工审批</text>
    <text x="244" y="470" font-size="10.5" fill="#6c7f92">企业新增的必需层：统一管理上千个 Agent 的权限与执行</text>
    <text x="74" y="428" font-size="11" font-weight="700" fill="#8f6a34">企业新增</text>
    <text x="74" y="444" font-size="11" font-weight="700" fill="#8f6a34">的必需层</text>
    <path d="M148 424h64" stroke="#8f6a34" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowGold)"/>

    <path d="M520 484v30" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="220" y="516" width="188" height="74" rx="10" fill="#fffdfa" stroke="#c8c0b3"/>
    <text x="244" y="546" font-family="Noto Serif SC, Songti SC, serif" font-size="15.5" font-weight="700" fill="#2c2822">模型</text>
    <text x="244" y="570" font-size="10.5" fill="#69665f">可替换 · 换模型越来越容易</text>
    <rect x="426" y="516" width="188" height="74" rx="10" fill="#fffdfa" stroke="#c8c0b3"/>
    <text x="450" y="546" font-family="Noto Serif SC, Songti SC, serif" font-size="15.5" font-weight="700" fill="#2c2822">记忆</text>
    <text x="450" y="570" font-size="10.5" fill="#69665f">沉淀 · 组织记忆资产</text>
    <rect x="632" y="516" width="188" height="74" rx="10" fill="#fffdfa" stroke="#c8c0b3"/>
    <text x="656" y="546" font-family="Noto Serif SC, Songti SC, serif" font-size="15.5" font-weight="700" fill="#2c2822">技能</text>
    <text x="656" y="570" font-size="10.5" fill="#69665f">复用 · 可执行的数字 SOP</text>
    <path d="M848 530v44" stroke="#c8c0b3" stroke-width="2"/>
    <text x="836" y="546" font-size="11" font-weight="700" fill="#8a857b">可替换底座</text>
    <text x="836" y="562" font-size="10.5" fill="#8a857b">真正的企业资产</text>
    <text x="836" y="578" font-size="10.5" fill="#8a857b">已经不在模型里</text>

    <path d="M520 590v26" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="220" y="618" width="600" height="56" rx="10" fill="#e6e0cf" stroke="#c8c0b3"/>
    <text x="520" y="651" text-anchor="middle" font-size="12" fill="#3c3831">Enterprise Systems：ERP · CRM · OA · DB · API —— 继续承担记账与执行</text>

    <path d="M520 674v24" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="360" y="700" width="320" height="44" rx="22" fill="#9a6a1c"/>
    <text x="520" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#fdf9ef">Business · 业务结果</text>
  </g>
</svg>
