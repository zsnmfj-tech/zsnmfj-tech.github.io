<svg xmlns="http://www.w3.org/2000/svg" width="390" height="670" viewBox="0 0 390 670" role="img" aria-labelledby="t d">
  <title id="t">推演中的未来企业软件架构</title>
  <desc id="d">人在最上层负责目标与判断，向下依次是 AI Workforce、Agent Control Plane、模型记忆技能三支柱、企业系统，最终产出业务结果。</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9d4c8"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6d6a62"/></marker>
  </defs>
  <rect width="390" height="670" fill="#f5f3eb"/>
  <rect width="390" height="670" fill="url(#paper)" opacity=".38"/>
  <text x="16" y="28" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#8f6a34">TARGET ARCHITECTURE</text>
  <text x="16" y="58" font-family="Noto Serif SC, Songti SC, serif" font-size="22" font-weight="700" fill="#171714">人在最上层，模型在底座</text>
  <text x="16" y="80" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11.5" fill="#69665f">目标下行 · 结果上行</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <circle cx="195" cy="132" r="40" fill="#171714"/>
    <circle cx="195" cy="121" r="8" fill="none" stroke="#f5f3eb" stroke-width="2"/>
    <path d="M181 150c3-10 8-15 14-15s11 5 14 15" fill="none" stroke="#f5f3eb" stroke-width="2"/>
    <text x="195" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#f5f3eb">人</text>
    <text x="195" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#57534a">目标 · 判断 · 审批 · 异常处理</text>

    <path d="M160 202v20" stroke="#6d6a62" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="205" y="214" font-size="9.5" fill="#8a857b">目标下行 · 结果上行</text>

    <rect x="16" y="226" width="358" height="66" rx="10" fill="#ebe7da" stroke="#c8c0b3"/>
    <text x="28" y="246" font-size="9" font-weight="700" letter-spacing="1.2" fill="#8a857b">AI WORKFORCE · 岗位 AGENT 编队</text>
    <rect x="22" y="256" width="82" height="24" rx="12" fill="#171714"/>
    <text x="63" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#faf8f1">销售 Agent</text>
    <rect x="110" y="256" width="82" height="24" rx="12" fill="#171714"/>
    <text x="151" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#faf8f1">财务 Agent</text>
    <rect x="198" y="256" width="82" height="24" rx="12" fill="#171714"/>
    <text x="239" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#faf8f1">开发 Agent</text>
    <rect x="286" y="256" width="82" height="24" rx="12" fill="#171714"/>
    <text x="327" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#faf8f1">风控 Agent</text>

    <path d="M195 292v24" stroke="#6d6a62" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="16" y="318" width="358" height="76" rx="10" fill="#e3ecf4" stroke="#1a5d92" stroke-width="1.6"/>
    <text x="28" y="342" font-size="11" font-weight="700" letter-spacing="1.4" fill="#1a5d92">AGENT CONTROL PLANE</text>
    <text x="28" y="362" font-size="10" fill="#33586e">注册 · 路由 · 调度 · 权限 · 沙箱</text>
    <text x="28" y="380" font-size="10" fill="#33586e">可观测 · 评估 · 人工审批</text>

    <path d="M195 394v24" stroke="#6d6a62" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="18" y="420" width="112" height="62" rx="8" fill="#fffdfa" stroke="#c8c0b3"/>
    <text x="32" y="446" font-family="Noto Serif SC, Songti SC, serif" font-size="13.5" font-weight="700" fill="#2c2822">模型</text>
    <text x="32" y="466" font-size="9" fill="#69665f">可替换</text>
    <rect x="141" y="420" width="112" height="62" rx="8" fill="#fffdfa" stroke="#c8c0b3"/>
    <text x="155" y="446" font-family="Noto Serif SC, Songti SC, serif" font-size="13.5" font-weight="700" fill="#2c2822">记忆</text>
    <text x="155" y="466" font-size="9" fill="#69665f">沉淀</text>
    <rect x="264" y="420" width="112" height="62" rx="8" fill="#fffdfa" stroke="#c8c0b3"/>
    <text x="278" y="446" font-family="Noto Serif SC, Songti SC, serif" font-size="13.5" font-weight="700" fill="#2c2822">技能</text>
    <text x="278" y="466" font-size="9" fill="#69665f">复用</text>

    <path d="M195 482v24" stroke="#6d6a62" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="16" y="508" width="358" height="44" rx="8" fill="#e6e0cf" stroke="#c8c0b3"/>
    <text x="195" y="526" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3c3831">Enterprise Systems</text>
    <text x="195" y="542" text-anchor="middle" font-size="9.5" fill="#69665f">ERP · CRM · OA · DB · API</text>

    <path d="M195 552v22" stroke="#6d6a62" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="105" y="576" width="180" height="36" rx="18" fill="#9a6a1c"/>
    <text x="195" y="599" text-anchor="middle" font-size="12" font-weight="700" fill="#fdf9ef">Business · 业务结果</text>

    <text x="195" y="644" text-anchor="middle" font-size="10" fill="#8a857b">可替换底座：真正的企业资产不在模型里</text>
  </g>
</svg>
