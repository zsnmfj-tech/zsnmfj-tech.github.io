<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc">
  <title id="title">Dyna Robotics 从 Dyna-1 到 Dyna-2 的技术路线</title>
  <desc id="desc">Dyna-1 改善连续运行，Dyna-1i 与后续预训练研究环境泛化，Dyna-2 用百万小时人类视频训练世界动作模型。现场学习与人类视频预训练相互补充。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker></defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}
    .title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}
    .label{font-size:13px;fill:#986b2e;font-weight:700}
    .node{font-size:19px;font-weight:700}
    .body{font-size:13px}
    .small{font-size:12px;fill:#625f58}
    .white{fill:#fffdf8}.gold{fill:#d3ad75}
  </style>
  <rect width="390" height="900" fill="#f6f2e9"/>
  <text x="22" y="32" class="label">01 / 技术路线</text>
  <text x="22" y="70" class="title">从连续运行</text>
  <text x="22" y="101" class="title">走到百万小时预训练</text>
  <text x="22" y="128" class="small">评测时长、部署环境和数据来源依次改变。</text>

  <g transform="translate(22 158)">
    <rect width="346" height="174" rx="10" fill="#fffdf8" stroke="#c7beae"/>
    <text x="20" y="30" class="label">2025 · DYNA-1</text>
    <text x="20" y="62" class="node">让机器人连续工作</text>
    <text x="20" y="94" class="body">24 小时 · 850+ 条餐巾 · 99.4% 任务成功</text>
    <text x="20" y="120" class="body">在无人工介入的运行中积累失败与恢复片段</text>
    <rect x="20" y="136" width="306" height="26" rx="13" fill="#f0e3ca"/>
    <text x="173" y="154" class="small" text-anchor="middle">奖励模型 × 部署反馈</text>
  </g>
  <path d="M195 335V355" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(22 366)">
    <rect width="346" height="174" rx="10" fill="#e7edf1" stroke="#c7beae"/>
    <text x="20" y="30" class="label">2025 · DYNA-1i / PRE-TRAINING</text>
    <text x="20" y="62" class="node">走出熟悉的工作台</text>
    <text x="20" y="94" class="body">大厅、停车场和会议现场检验环境变化</text>
    <text x="20" y="120" class="body">继续扩展零样本与少样本任务</text>
    <rect x="20" y="136" width="306" height="26" rx="13" fill="#fffdf8"/>
    <text x="173" y="154" class="small" text-anchor="middle">技能泛化 × 现场适配</text>
  </g>
  <path d="M195 543V563" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(22 574)">
    <rect width="346" height="174" rx="10" fill="#1b3654"/>
    <text x="20" y="30" class="label gold">2026 · DYNA-2</text>
    <text x="20" y="62" class="node white">扩大可学习的经验</text>
    <text x="20" y="94" class="body white">超过 100 万小时人类操作视频</text>
    <text x="20" y="120" class="body white">视频与动作联合训练，检验跨本体迁移</text>
    <rect x="20" y="136" width="306" height="26" rx="13" fill="#fffdf8"/>
    <text x="173" y="154" class="small" text-anchor="middle">World-Action Model</text>
  </g>

  <rect x="22" y="780" width="346" height="76" rx="10" fill="#dce8e5"/>
  <text x="42" y="810" class="label">两类经验相互补充</text>
  <text x="42" y="837" class="body">现场学习与人类视频预训练继续配合</text>
  <text x="22" y="883" class="small">根据 Dyna Robotics 官方公开材料整理</text>
</svg>
