<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Dyna-1 与 Dyna-2 的机器人基础模型研究谱系</title>
  <desc id="desc">奖励与任务进度、视觉语言动作模型、视频动作联合建模和人类第一视角视频规模化四条研究线，分别构成 Dyna-1 与 Dyna-2 的技术背景。虚线表示研究问题关联，不代表 Dyna 直接采用相关论文实现。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}
    .title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}
    .label{font-size:14px;fill:#986b2e;font-weight:700}
    .node{font-size:18px;font-weight:700}
    .body{font-size:13px}.small{font-size:11px;fill:#625f58}
    .paper{font-size:12px;font-weight:700}.white{fill:#fffdf8}.gold{fill:#d3ad75}
  </style>
  <rect width="960" height="620" fill="#f6f2e9"/>
  <text x="36" y="38" class="label">07 / 论文谱系</text>
  <text x="36" y="82" class="title">四条研究线，汇入两代 Dyna 模型</text>
  <text x="36" y="114" class="small">外部论文帮助定位技术问题，Dyna 官方报告负责说明两代模型本身。</text>

  <g>
    <rect x="36" y="148" width="620" height="78" rx="10" fill="#fffdf8" stroke="#c7beae"/>
    <text x="54" y="176" class="label">奖励与任务进度</text>
    <text x="54" y="201" class="small">从视频估计奖励、阶段与进度</text>
    <rect x="222" y="165" width="112" height="38" rx="8" fill="#f0e3ca"/><text x="278" y="189" text-anchor="middle" class="paper">VIP · 2022</text>
    <rect x="344" y="165" width="112" height="38" rx="8" fill="#f0e3ca"/><text x="400" y="189" text-anchor="middle" class="paper">LIV · 2023</text>
    <rect x="466" y="165" width="168" height="38" rx="8" fill="#f0e3ca"/><text x="550" y="189" text-anchor="middle" class="paper">UVD · 2023</text>

    <rect x="36" y="242" width="620" height="78" rx="10" fill="#e7edf1" stroke="#c7beae"/>
    <text x="54" y="270" class="label">VLA 连续动作</text>
    <text x="54" y="295" class="small">视觉语言语义 + 动作生成</text>
    <rect x="222" y="259" width="142" height="38" rx="8" fill="#fffdf8"/><text x="293" y="283" text-anchor="middle" class="paper">π0 · 2024</text>
    <rect x="374" y="259" width="260" height="38" rx="8" fill="#fffdf8"/><text x="504" y="283" text-anchor="middle" class="paper">Mixture-of-Transformers · 2024</text>

    <rect x="36" y="336" width="620" height="90" rx="10" fill="#fffdf8" stroke="#c7beae"/>
    <text x="54" y="366" class="label">视频与动作联合建模</text>
    <text x="54" y="391" class="small">把未来画面变成策略训练信号</text>
    <rect x="222" y="353" width="148" height="46" rx="8" fill="#dce8e5"/><text x="296" y="374" text-anchor="middle" class="paper">Unified World</text><text x="296" y="390" text-anchor="middle" class="small">Models · 2025</text>
    <rect x="380" y="353" width="112" height="46" rx="8" fill="#dce8e5"/><text x="436" y="381" text-anchor="middle" class="paper">DreamZero</text><text x="436" y="397" text-anchor="middle" class="small">2026</text>
    <rect x="502" y="353" width="132" height="46" rx="8" fill="#dce8e5"/><text x="568" y="374" text-anchor="middle" class="paper">Causality in</text><text x="568" y="390" text-anchor="middle" class="small">Video Diffusers · 2026</text>

    <rect x="36" y="442" width="620" height="78" rx="10" fill="#dce8e5" stroke="#c7beae"/>
    <text x="54" y="470" class="label">人类第一视角视频</text>
    <text x="54" y="495" class="small">扩大数据，并处理人机形态差异</text>
    <rect x="222" y="459" width="192" height="38" rx="8" fill="#fffdf8"/><text x="318" y="483" text-anchor="middle" class="paper">EgoScale · 2026</text>
    <text x="436" y="483" class="small">约 20K h · 含动作对齐阶段</text>
  </g>

  <g fill="none" stroke="#657586" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow)">
    <path d="M656 187H697"/>
    <path d="M656 270H680V235H697"/>
    <path d="M656 292H680V383H697"/>
    <path d="M656 381H697"/>
    <path d="M656 481H697"/>
  </g>

  <g>
    <rect x="710" y="160" width="214" height="112" rx="10" fill="#e7edf1" stroke="#657586"/>
    <text x="730" y="188" class="label">2025 · DYNA-1</text>
    <text x="730" y="219" class="node">生产型 VLA</text>
    <text x="730" y="245" class="body">奖励反馈 × 部署闭环</text>
    <path d="M817 276V328" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="710" y="340" width="214" height="180" rx="10" fill="#1b3654"/>
    <text x="730" y="370" class="label gold">2026 · DYNA-2</text>
    <text x="730" y="403" class="node white">World-Action Model</text>
    <line x1="730" y1="420" x2="904" y2="420" stroke="#657586"/>
    <text x="730" y="448" class="body white">百万小时人类视频</text>
    <text x="730" y="474" class="body white">未来视频 + 动作</text>
    <text x="730" y="500" class="body white">Human → Robot scaling</text>
  </g>

  <rect x="36" y="544" width="888" height="42" rx="10" fill="#f0e3ca"/>
  <text x="58" y="570" class="body">虚线表示研究问题与方法背景，不表示 Dyna 逐项沿用了这些论文的实现。</text>
  <text x="36" y="610" class="small">外部论文与 Dyna 官方报告分色呈现 · 作者根据公开材料整理</text>
</svg>
