<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1180" viewBox="0 0 390 1180" role="img" aria-labelledby="title desc">
  <title id="title">Dyna-1 报告对照版与 Dyna-2 规模实验协同训练架构</title>
  <desc id="desc">报告对照版 Dyna-1 使用 Qwen3-VL-4B 初始化。Dyna-2 规模实验协同训练视频与动作分支，动作分支读取视频分支的已观察上下文；推理时直接输出动作，不读取预测的未来视频。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker>
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}
    .title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}
    .label{font-size:13px;fill:#986b2e;font-weight:700}.node{font-size:18px;font-weight:700}
    .body{font-size:13px}.small{font-size:12px;fill:#625f58}.tiny{font-size:11px;fill:#625f58}
    .white{fill:#fffdf8}.gold{fill:#d3ad75}
  </style>
  <rect width="390" height="1180" fill="#f6f2e9"/>
  <text x="22" y="32" class="label">03 / 模型架构</text>
  <text x="22" y="70" class="title">Dyna-2 多学了一件事</text>
  <text x="22" y="101" class="title">画面接下来怎样变化</text>
  <text x="22" y="128" class="small">规模实验协同训练视频与动作两个分支。</text>

  <g transform="translate(22 154)">
    <rect width="346" height="384" rx="11" fill="#fffdf8" stroke="#c7beae"/>
    <text x="18" y="30" class="label">DYNA-1 · VLA</text>
    <text x="18" y="60" class="node">当前观测直接变成动作</text>
    <g transform="translate(18 82)">
      <rect width="92" height="30" rx="15" fill="#e7edf1"/><text x="46" y="20" class="tiny" text-anchor="middle">相机画面</text>
      <rect x="100" width="92" height="30" rx="15" fill="#f0e3ca"/><text x="146" y="20" class="tiny" text-anchor="middle">语言指令</text>
      <rect x="200" width="110" height="30" rx="15" fill="#dce8e5"/><text x="255" y="20" class="tiny" text-anchor="middle">本体状态</text>
    </g>
    <path d="M173 115V135" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="144" width="310" height="66" rx="9" fill="#1b3654"/>
    <text x="173" y="171" class="node white" text-anchor="middle">视觉语言主干 ＋ 动作分支</text>
    <text x="173" y="194" class="tiny white" text-anchor="middle">报告对照版 · Qwen3-VL-4B 初始化</text>
    <path d="M173 213V231" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="73" y="240" width="200" height="48" rx="24" fill="#f0e3ca" stroke="#c7beae"/>
    <text x="173" y="270" class="node" text-anchor="middle">连续机器人动作</text>
    <path d="M173 291V309" stroke="#986b2e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#gold-arrow)"/>
    <rect x="38" y="318" width="270" height="48" rx="8" fill="#e7edf1" stroke="#c7beae"/>
    <text x="173" y="338" class="body" text-anchor="middle">部署视频 → 奖励模型 → 筛选数据</text>
    <text x="173" y="356" class="tiny" text-anchor="middle">提供进度反馈，辅助整理部署数据</text>
  </g>

  <path d="M195 542V568" stroke="#986b2e" stroke-width="2" marker-end="url(#gold-arrow)"/>
  <text x="207" y="561" class="label">模型目标改变</text>

  <g transform="translate(22 580)">
    <rect width="346" height="480" rx="11" fill="#e7edf1" stroke="#c7beae"/>
    <text x="18" y="30" class="label">DYNA-2 · WORLD-ACTION MODEL</text>
    <text x="18" y="60" class="node">规模实验：视频与动作协同训练</text>
    <g transform="translate(18 82)">
      <rect width="96" height="30" rx="15" fill="#fffdf8"/><text x="48" y="20" class="tiny" text-anchor="middle">已观察视频</text>
      <rect x="105" width="96" height="30" rx="15" fill="#f0e3ca"/><text x="153" y="20" class="tiny" text-anchor="middle">语言→视频</text>
      <rect x="210" width="100" height="30" rx="15" fill="#dce8e5"/><text x="260" y="20" class="tiny" text-anchor="middle">本体→动作</text>
    </g>
    <path d="M91 115V137" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M255 115V137" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(18 146)">
      <rect width="144" height="104" rx="9" fill="#1b3654"/>
      <text x="72" y="28" class="label gold" text-anchor="middle">VIDEO</text>
      <text x="72" y="56" class="node white" text-anchor="middle">Video DiT</text>
      <text x="72" y="79" class="tiny white" text-anchor="middle">因果视频 token</text>
      <text x="72" y="96" class="tiny white" text-anchor="middle">Flow Matching</text>
    </g>
    <g transform="translate(184 146)">
      <rect width="144" height="104" rx="9" fill="#fffdf8" stroke="#c7beae"/>
      <text x="72" y="28" class="label" text-anchor="middle">ACTION</text>
      <text x="72" y="56" class="node" text-anchor="middle">浅层动作分支</text>
      <text x="72" y="79" class="tiny" text-anchor="middle">双向动作 token</text>
      <text x="72" y="96" class="tiny" text-anchor="middle">Flow Matching</text>
    </g>
    <path d="M164 198H178" stroke="#986b2e" stroke-width="2" marker-end="url(#gold-arrow)"/>
    <text x="173" y="276" class="tiny" text-anchor="middle">动作分支读取已观察上下文</text>
    <rect x="18" y="294" width="144" height="50" rx="8" fill="#1b3654"/>
    <text x="90" y="315" class="tiny white" text-anchor="middle">训练目标</text><text x="90" y="334" class="body white" text-anchor="middle">未来视频</text>
    <rect x="184" y="294" width="144" height="50" rx="8" fill="#f0e3ca" stroke="#c7beae"/>
    <text x="256" y="315" class="tiny" text-anchor="middle">训练目标</text><text x="256" y="334" class="body" text-anchor="middle">未来动作</text>
    <rect x="18" y="365" width="310" height="82" rx="9" fill="#dce8e5"/>
    <text x="173" y="392" class="label" text-anchor="middle">在线推理</text>
    <text x="173" y="418" class="node" text-anchor="middle">当前观察 → 直接输出动作</text>
    <text x="173" y="439" class="tiny" text-anchor="middle">不读取预测的未来视频</text>
  </g>

  <rect x="22" y="1082" width="346" height="54" rx="8" fill="#fffdf8" stroke="#c7beae"/>
  <text x="195" y="1104" class="small" text-anchor="middle">两代模型仍需要机器人数据</text>
  <text x="195" y="1124" class="small" text-anchor="middle">适配具体任务与硬件</text>
  <text x="22" y="1163" class="small">依据 Dyna-2 技术报告整理</text>
</svg>
