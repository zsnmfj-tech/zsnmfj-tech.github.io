<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Dyna-2 百万小时规模实验的三层证据</title>
  <desc id="desc">图表区分人类留出集、三十九项机器人离线评估和十四项真机任务。真机任务经机器人后训练后的归一化综合得分，随预训练视频从一千小时增加到一百万小时，由百分之二十上升到百分之五十三。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}
    .title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}
    .label{font-size:15px;fill:#986b2e;font-weight:700}
    .node{font-size:18px;font-weight:700}
    .body{font-size:14px}
    .small{font-size:12px;fill:#625f58}
    .value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
    .white{fill:#fffdf8}.gold{fill:#d3ad75}
  </style>
  <rect width="960" height="640" fill="#f6f2e9"/>
  <text x="36" y="38" class="label">05 / 规模实验</text>
  <text x="36" y="82" class="title">三层评估，不能读成一条成功率曲线</text>
  <text x="36" y="114" class="small">先看人类动作预测，再看未见机器人离线迁移，最后才是真机执行。</text>

  <g transform="translate(36 148)">
    <rect width="266" height="372" rx="10" fill="#fffdf8" stroke="#c7beae"/>
    <text x="22" y="34" class="label">评估台阶</text>
    <line x1="38" y1="76" x2="38" y2="308" stroke="#657586" stroke-width="2" marker-end="url(#arrow)"/>

    <circle cx="38" cy="92" r="13" fill="#f0e3ca" stroke="#986b2e"/>
    <text x="38" y="97" text-anchor="middle" class="small">1</text>
    <text x="65" y="84" class="node">人类留出集</text>
    <text x="65" y="107" class="body">约 100 小时</text>
    <text x="65" y="129" class="small">动作预测指标持续改善</text>

    <circle cx="38" cy="196" r="13" fill="#e7edf1" stroke="#657586"/>
    <text x="38" y="201" text-anchor="middle" class="small">2</text>
    <text x="65" y="188" class="node">机器人离线评估</text>
    <text x="65" y="211" class="body">39 项未见机器人任务</text>
    <text x="65" y="233" class="small">比较预测动作，不执行任务</text>

    <circle cx="38" cy="300" r="13" fill="#1b3654"/>
    <text x="38" y="305" text-anchor="middle" class="small white">3</text>
    <text x="65" y="292" class="node">真机执行</text>
    <text x="65" y="315" class="body">14 项任务，每项最多 10h</text>
    <text x="65" y="337" class="small">加入机器人 post-training</text>
  </g>

  <g transform="translate(326 148)">
    <rect width="598" height="372" rx="10" fill="#fffdf8" stroke="#c7beae"/>
    <text x="24" y="34" class="label">14 项真机任务 · 归一化综合得分</text>
    <text x="574" y="34" text-anchor="end" class="small">Dyna 官方报告</text>

    <line x1="64" y1="296" x2="566" y2="296" stroke="#9b978e"/>
    <line x1="64" y1="229" x2="566" y2="229" stroke="#ded8cb" stroke-dasharray="4 5"/>
    <line x1="64" y1="162" x2="566" y2="162" stroke="#ded8cb" stroke-dasharray="4 5"/>
    <line x1="64" y1="95" x2="566" y2="95" stroke="#ded8cb" stroke-dasharray="4 5"/>
    <g class="small" text-anchor="end">
      <text x="54" y="300">0</text><text x="54" y="233">20</text><text x="54" y="166">40</text><text x="54" y="99">60</text>
    </g>

    <rect x="101" y="229" width="72" height="67" rx="6" fill="#d9d0c1"/>
    <rect x="221" y="202" width="72" height="94" rx="6" fill="#b9c6ce"/>
    <rect x="341" y="145" width="72" height="151" rx="6" fill="#657586"/>
    <rect x="461" y="118" width="72" height="178" rx="6" fill="#1b3654"/>
    <text x="137" y="216" text-anchor="middle" class="value">20%</text>
    <text x="257" y="189" text-anchor="middle" class="value">28%</text>
    <text x="377" y="132" text-anchor="middle" class="value">45%</text>
    <text x="497" y="105" text-anchor="middle" class="value">53%</text>
    <g class="body" text-anchor="middle">
      <text x="137" y="324">1K h</text><text x="257" y="324">10K h</text><text x="377" y="324">100K h</text><text x="497" y="324">1M h</text>
    </g>
    <text x="299" y="351" text-anchor="middle" class="small">人类第一视角视频预训练规模</text>
  </g>

  <g transform="translate(36 544)">
    <rect width="888" height="60" rx="10" fill="#dce8e5"/>
    <text x="22" y="26" class="label">怎样读这组数字</text>
    <text x="22" y="47" class="body">20% → 53% 是经过机器人后训练的综合评分，不是零样本成功率；1M 模型在 14 项任务中的 9 项最好。</text>
  </g>
  <text x="36" y="628" class="small">来源：Dyna-2 技术报告 · 公司披露结果 · 作者重新绘制</text>
</svg>
