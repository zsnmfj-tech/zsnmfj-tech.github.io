<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1350" viewBox="0 0 390 1350" role="img" aria-labelledby="title desc">
  <title id="title">Palantir 与中数睿智案例证据账本及项目验收路径移动版</title>
  <desc id="desc">分别记录两条路线公开案例数字及待核信息，再依次核对部署边界、最小业务闭环、对象动作权限、第二场景复用和退出迁移。</desc>
  <defs><pattern id="paperDots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#315a68" opacity=".08"/></pattern><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d887e"/></marker></defs>
  <rect width="390" height="1350" rx="16" fill="#f5f3eb"/><rect width="390" height="1350" rx="16" fill="url(#paperDots)"/>
  <text x="22" y="38" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8f6a34">EVIDENCE LEDGER · DELIVERY CHECK</text>
  <text x="22" y="71" font-family="Noto Serif SC, Songti SC, serif" font-size="22" font-weight="700" fill="#171714">分别看案例</text>
  <text x="22" y="100" font-family="Noto Serif SC, Songti SC, serif" font-size="22" font-weight="700" fill="#171714">再看项目如何验收</text>
  <text x="22" y="126" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#69665f">公开数字提供线索，不等于经第三方审计。</text>
  <text x="22" y="154" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#77736b">案例证据账本 · 分别核验</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <rect x="22" y="169" width="346" height="257" rx="14" fill="#fffdfa" stroke="#9eb2b7"/>
    <path d="M22 183a14 14 0 0 1 14-14h318a14 14 0 0 1 14 14v43H22Z" fill="#315a68"/>
    <text x="40" y="197" font-family="Noto Serif SC, Songti SC, serif" font-size="16" font-weight="700" fill="#f5f3eb">Palantir × Airbus</text>
    <rect x="271" y="181" width="79" height="23" rx="6" fill="#e4eceb"/><text x="310.5" y="196" text-anchor="middle" font-size="9" font-weight="700" fill="#315a68">厂商案例</text>
    <text x="40" y="273" font-family="Noto Serif SC, Songti SC, serif" font-size="42" font-weight="700" fill="#315a68">+33%</text>
    <text x="174" y="254" font-size="13" font-weight="700" fill="#24231f">A350 交付量</text>
    <text x="174" y="273" font-size="10" fill="#69665f">Palantir-Airbus 材料披露</text>
    <line x1="40" y1="293" x2="350" y2="293" stroke="#d7d2c7"/>
    <text x="40" y="316" font-size="10" font-weight="700" fill="#315a68">已公开</text><text x="92" y="316" font-size="10" fill="#3f3d37">具名客户与具体机型指标</text>
    <text x="40" y="344" font-size="10" font-weight="700" fill="#315a68">可追溯</text><text x="92" y="344" font-size="10" fill="#3f3d37">有合作起点及扩展路径</text>
    <text x="40" y="372" font-size="10" font-weight="700" fill="#8f6a34">仍待核</text><text x="92" y="372" font-size="10" fill="#3f3d37">统计方法、样本和外部对照</text>
    <rect x="40" y="389" width="310" height="23" rx="6" fill="#e9e5dc"/><text x="195" y="404" text-anchor="middle" font-size="9" fill="#5e5a52">具名厂商案例，不等同独立效果审计</text>

    <rect x="22" y="442" width="346" height="336" rx="14" fill="#fffdfa" stroke="#c8b38f"/>
    <path d="M22 456a14 14 0 0 1 14-14h318a14 14 0 0 1 14 14v50H22Z" fill="#8f6a34"/>
    <text x="40" y="469" font-family="Noto Serif SC, Songti SC, serif" font-size="16" font-weight="700" fill="#fffdf7">中数睿智</text>
    <text x="40" y="489" font-size="10" fill="#eee2cd">能源 / 油气 / AI-FDE</text>
    <rect x="271" y="454" width="79" height="23" rx="6" fill="#efe5d4"/><text x="310.5" y="469" text-anchor="middle" font-size="9" font-weight="700" fill="#7a592c">公司/媒体</text>
    <rect x="40" y="527" width="148" height="73" rx="9" fill="#efe5d4"/><text x="54" y="556" font-family="Noto Serif SC, Songti SC, serif" font-size="20" font-weight="700" fill="#8f6a34">15–20 分钟</text><text x="54" y="581" font-size="10" fill="#5c5141">提前预警</text>
    <rect x="202" y="527" width="148" height="73" rx="9" fill="#efe5d4"/><text x="216" y="556" font-family="Noto Serif SC, Songti SC, serif" font-size="22" font-weight="700" fill="#8f6a34">94%</text><text x="216" y="581" font-size="10" fill="#5c5141">根因定位</text>
    <rect x="40" y="614" width="148" height="73" rx="9" fill="#efe5d4"/><text x="54" y="643" font-family="Noto Serif SC, Songti SC, serif" font-size="22" font-weight="700" fill="#8f6a34">20×</text><text x="54" y="668" font-size="10" fill="#5c5141">故障排查效率</text>
    <rect x="202" y="614" width="148" height="73" rx="9" fill="#efe5d4"/><text x="216" y="643" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#8f6a34">-80% / -70%</text><text x="216" y="668" font-size="10" fill="#5c5141">AI-FDE 周期 / 人力</text>
    <rect x="40" y="704" width="310" height="56" rx="8" fill="#e9e5dc"/>
    <text x="54" y="723" font-size="10" font-weight="700" fill="#8f6a34">仍待核</text><text x="104" y="723" font-size="10" fill="#5e5a52">客户名、样本周期、基线与对照</text>
    <text x="54" y="742" font-size="9" fill="#6c6962">数字按公司/媒体披露记录，不视为独立审计</text>
  </g>

  <text x="22" y="815" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#77736b">项目验收路径 · 把方案主张改写成验证问题</text>
  <line x1="54" y1="855" x2="54" y2="1178" stroke="#a9a399" stroke-width="1.7" marker-end="url(#arrowInk)"/>
  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <circle cx="54" cy="863" r="25" fill="#171714"/><text x="54" y="859" text-anchor="middle" font-size="9" font-weight="700" fill="#cfc9be">01</text><text x="54" y="874" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">边界</text>
    <text x="94" y="858" font-size="12" font-weight="700" fill="#24231f">部署与数据边界</text><text x="94" y="877" font-size="10" fill="#69665f">私有部署、数据主权与跨域规则</text>
    <circle cx="54" cy="937" r="25" fill="#315a68"/><text x="54" y="933" text-anchor="middle" font-size="9" font-weight="700" fill="#cfe0e3">02</text><text x="54" y="948" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">闭环</text>
    <text x="94" y="932" font-size="12" font-weight="700" fill="#24231f">最小业务闭环</text><text x="94" y="951" font-size="10" fill="#69665f">从一项决策走到真实系统写回</text>
    <circle cx="54" cy="1011" r="25" fill="#8f6a34"/><text x="54" y="1007" text-anchor="middle" font-size="9" font-weight="700" fill="#eee2cd">03</text><text x="54" y="1022" text-anchor="middle" font-size="10" font-weight="700" fill="#fffdf7">治理</text>
    <text x="94" y="1006" font-size="12" font-weight="700" fill="#24231f">对象 / 动作 / 权限</text><text x="94" y="1025" font-size="10" fill="#69665f">逐项检查语义、审批与审计</text>
    <circle cx="54" cy="1085" r="25" fill="#315a68"/><text x="54" y="1081" text-anchor="middle" font-size="9" font-weight="700" fill="#cfe0e3">04</text><text x="54" y="1096" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">复用</text>
    <text x="94" y="1080" font-size="12" font-weight="700" fill="#24231f">第二场景复用</text><text x="94" y="1099" font-size="10" fill="#69665f">同一资产换场景后再用一次</text>
    <circle cx="54" cy="1159" r="25" fill="#171714"/><text x="54" y="1155" text-anchor="middle" font-size="9" font-weight="700" fill="#cfc9be">05</text><text x="54" y="1170" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">迁移</text>
    <text x="94" y="1154" font-size="12" font-weight="700" fill="#24231f">退出和迁移</text><text x="94" y="1173" font-size="10" fill="#69665f">模型、数据与本体能否带走</text>
  </g>

  <rect x="22" y="1215" width="346" height="99" rx="12" fill="#171714"/>
  <text x="40" y="1242" font-family="Noto Serif SC, Songti SC, serif" font-size="15" font-weight="700" fill="#f5f3eb">一个项目 · 一套前后口径</text>
  <text x="40" y="1264" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#d4cfc5">记录上线前基线、人工投入与验收指标，</text>
  <text x="40" y="1281" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#d4cfc5">判断方案在该项目中是否产生价值。</text>
  <text x="40" y="1302" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="9" fill="#a9a399">公开案例数字保留原来源属性，未作第三方验证</text>
</svg>
