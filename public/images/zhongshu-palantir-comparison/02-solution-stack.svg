<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
  <title id="title">Palantir 与中数睿智六层解决方案架构对照</title>
  <desc id="desc">从数据底座、业务语义、运行引擎、应用开发、治理进化到交付方案，对照 Palantir 与中数睿智公开产品能力。横向层级为作者归纳，不代表产品一一对应，公开资料未披露不等于不具备。</desc>
  <defs>
    <pattern id="paperDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#315a68" opacity=".075"/></pattern>
  </defs>
  <rect width="1040" height="820" rx="18" fill="#f5f3eb"/><rect width="1040" height="820" rx="18" fill="url(#paperDots)"/>

  <text x="58" y="44" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#8f6a34">PUBLIC PRODUCT MAP · AUTHOR'S SYNTHESIS</text>
  <text x="58" y="84" font-family="Noto Serif SC, Songti SC, serif" font-size="30" font-weight="700" fill="#171714">两家公司把能力装进了怎样的产品栈</text>
  <text x="58" y="114" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="14" fill="#69665f">相似业务问题被拆成不同的产品名称、运行组件与交付方法，横向对齐用于理解，不等于一一映射。</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <rect x="58" y="146" width="154" height="48" rx="10" fill="#171714"/>
    <text x="78" y="176" font-size="12" font-weight="700" letter-spacing="1.3" fill="#f5f3eb">能力层级</text>
    <rect x="228" y="146" width="356" height="48" rx="10" fill="#315a68"/>
    <circle cx="252" cy="170" r="6" fill="#d8e3e5"/><text x="270" y="176" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#f5f3eb">Palantir</text>
    <text x="561" y="175" text-anchor="end" font-size="10" letter-spacing="1.1" fill="#d8e3e5">FOUNDRY · AIP</text>
    <rect x="596" y="146" width="386" height="48" rx="10" fill="#8f6a34"/>
    <circle cx="620" cy="170" r="6" fill="#f2e9d8"/><text x="638" y="176" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#fffdf7">中数睿智</text>
    <text x="958" y="175" text-anchor="end" font-size="10" letter-spacing="1.1" fill="#f2e9d8">AI-NATIVE STACK</text>

    <g>
      <rect x="58" y="208" width="154" height="78" rx="10" fill="#ebe7dc" stroke="#d1c8ba"/>
      <circle cx="79" cy="232" r="12" fill="#171714"/><text x="79" y="236" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">01</text>
      <text x="99" y="236" font-size="14" font-weight="700" fill="#24231f">数据底座</text><text x="78" y="261" font-size="11" fill="#77736b">接入 · 治理 · 供给</text>
      <rect x="228" y="208" width="356" height="78" rx="10" fill="#edf2f1" stroke="#b7c6c4"/>
      <circle cx="250" cy="231" r="5" fill="#315a68"/><text x="265" y="236" font-size="14" font-weight="700" fill="#274a55">Foundry 数据资产与数据服务</text>
      <text x="250" y="263" font-size="12" fill="#4e6267">集成、血缘、转换、质量与实时数据</text>
      <rect x="596" y="208" width="386" height="78" rx="10" fill="#f3ede2" stroke="#d4c29f"/>
      <circle cx="618" cy="231" r="5" fill="#8f6a34"/><text x="633" y="236" font-size="14" font-weight="700" fill="#725328">起源数据工厂 · AI 数据治理</text>
      <text x="618" y="263" font-size="12" fill="#715f43">面向模型与 Agent 组织数据供给</text>
    </g>

    <g>
      <rect x="58" y="294" width="154" height="78" rx="10" fill="#fffdfa" stroke="#d1c8ba"/>
      <circle cx="79" cy="318" r="12" fill="#171714"/><text x="79" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">02</text>
      <text x="99" y="322" font-size="14" font-weight="700" fill="#24231f">业务语义</text><text x="78" y="347" font-size="11" fill="#77736b">对象 · 关系 · 行动</text>
      <rect x="228" y="294" width="356" height="78" rx="10" fill="#fffdfa" stroke="#b7c6c4"/>
      <circle cx="250" cy="317" r="5" fill="#315a68"/><text x="265" y="322" font-size="14" font-weight="700" fill="#274a55">Ontology</text>
      <text x="250" y="349" font-size="12" fill="#4e6267">对象、属性、关系、动作与动态安全</text>
      <rect x="596" y="294" width="386" height="78" rx="10" fill="#fffdfa" stroke="#d4c29f"/>
      <circle cx="618" cy="317" r="5" fill="#8f6a34"/><text x="633" y="322" font-size="14" font-weight="700" fill="#725328">全知中枢</text>
      <text x="618" y="349" font-size="12" fill="#715f43">公开报道另称“动态本体”，描述对象、逻辑与行动</text>
    </g>

    <g>
      <rect x="58" y="380" width="154" height="78" rx="10" fill="#ebe7dc" stroke="#d1c8ba"/>
      <circle cx="79" cy="404" r="12" fill="#171714"/><text x="79" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">03</text>
      <text x="99" y="408" font-size="14" font-weight="700" fill="#24231f">运行与算力</text><text x="78" y="433" font-size="11" fill="#77736b">状态 · 计算 · 训推</text>
      <rect x="228" y="380" width="356" height="78" rx="10" fill="#edf2f1" stroke="#b7c6c4"/>
      <circle cx="250" cy="403" r="5" fill="#315a68"/><text x="265" y="408" font-size="14" font-weight="700" fill="#274a55">Ontology Engine</text>
      <text x="250" y="435" font-size="12" fill="#4e6267">读取、订阅、查询、事务、批流与 CDC</text>
      <rect x="596" y="380" width="386" height="78" rx="10" fill="#f3ede2" stroke="#d4c29f"/>
      <circle cx="618" cy="403" r="5" fill="#8f6a34"/><text x="633" y="408" font-size="14" font-weight="700" fill="#725328">模型训推与算力</text>
      <text x="618" y="435" font-size="12" fill="#715f43">训练、推理、调度与算力相关能力</text>
    </g>

    <g>
      <rect x="58" y="466" width="154" height="78" rx="10" fill="#fffdfa" stroke="#d1c8ba"/>
      <circle cx="79" cy="490" r="12" fill="#171714"/><text x="79" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">04</text>
      <text x="99" y="494" font-size="14" font-weight="700" fill="#24231f">应用与开发</text><text x="78" y="519" font-size="11" fill="#77736b">工具 · Agent · 应用</text>
      <rect x="228" y="466" width="356" height="78" rx="10" fill="#fffdfa" stroke="#b7c6c4"/>
      <circle cx="250" cy="489" r="5" fill="#315a68"/><text x="265" y="494" font-size="13" font-weight="700" fill="#274a55">Functions · Actions · Toolchain · MCP · AIP</text>
      <text x="250" y="521" font-size="12" fill="#4e6267">从业务函数、动作到应用和智能体开发</text>
      <rect x="596" y="466" width="386" height="78" rx="10" fill="#fffdfa" stroke="#d4c29f"/>
      <circle cx="618" cy="489" r="5" fill="#8f6a34"/><text x="633" y="494" font-size="13" font-weight="700" fill="#725328">智能指令 · ChatBI · 智能搜索 · 智能报告</text>
      <text x="618" y="521" font-size="12" fill="#715f43">多 Agent 开发与面向业务人员的应用组合</text>
    </g>

    <g>
      <rect x="58" y="552" width="154" height="78" rx="10" fill="#ebe7dc" stroke="#d1c8ba"/>
      <circle cx="79" cy="576" r="12" fill="#171714"/><text x="79" y="580" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">05</text>
      <text x="99" y="580" font-size="14" font-weight="700" fill="#24231f">治理与进化</text><text x="78" y="605" font-size="11" fill="#77736b">权限 · 评估 · 反馈</text>
      <rect x="228" y="552" width="356" height="78" rx="10" fill="#edf2f1" stroke="#b7c6c4"/>
      <circle cx="250" cy="575" r="5" fill="#315a68"/><text x="265" y="580" font-size="14" font-weight="700" fill="#274a55">动态安全 · 权限 · 审计</text>
      <text x="250" y="607" font-size="12" fill="#4e6267">对象级许可、变更审查与运行治理</text>
      <rect x="596" y="552" width="386" height="78" rx="10" fill="#f3ede2" stroke="#d4c29f"/>
      <circle cx="618" cy="575" r="5" fill="#8f6a34"/><text x="633" y="580" font-size="14" font-weight="700" fill="#725328">进化引擎 · 场景评估 · 知识治理</text>
      <text x="618" y="607" font-size="12" fill="#715f43">围绕知识与智能应用形成持续反馈</text>
    </g>

    <g>
      <rect x="58" y="638" width="154" height="78" rx="10" fill="#fffdfa" stroke="#d1c8ba"/>
      <circle cx="79" cy="662" r="12" fill="#171714"/><text x="79" y="666" text-anchor="middle" font-size="10" font-weight="700" fill="#f5f3eb">06</text>
      <text x="99" y="666" font-size="14" font-weight="700" fill="#24231f">交付与方案</text><text x="78" y="691" font-size="11" fill="#77736b">验证 · 现场 · 复用</text>
      <rect x="228" y="638" width="356" height="78" rx="10" fill="#fffdfa" stroke="#b7c6c4"/>
      <circle cx="250" cy="661" r="5" fill="#315a68"/><text x="265" y="666" font-size="14" font-weight="700" fill="#274a55">Bootcamp · FDE · AI FDE</text>
      <text x="250" y="693" font-size="12" fill="#4e6267">短周期验证、现场交付、平台内 AI 工程代理</text>
      <rect x="596" y="638" width="386" height="78" rx="10" fill="#fffdfa" stroke="#d4c29f"/>
      <circle cx="618" cy="661" r="5" fill="#8f6a34"/><text x="633" y="666" font-size="14" font-weight="700" fill="#725328">行业方案 · AI-FDE</text>
      <text x="618" y="693" font-size="12" fill="#715f43">央国企、能源、电信；公司定义的交付方法</text>
    </g>
  </g>

  <path d="M58 751H982" stroke="#d4cec1"/>
  <text x="58" y="776" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#6d665a">阅读边界</text>
  <text x="128" y="776" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#6d665a">横向层级为作者归纳，不代表产品一一对应；公开资料未披露，不等于相关能力不存在。</text>
  <text x="58" y="799" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#8a857b">命名与范围依据两家公司截至写作时的公开资料整理，具体可用性仍需在项目环境中验证。</text>
</svg>
