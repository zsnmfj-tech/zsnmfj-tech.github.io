<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc">
  <title id="title">企业 AI 业务中间层与运行反馈闭环移动版</title>
  <desc id="desc">业务系统经过对象、关系、规则、状态和权限组成的业务中间层，再由模型与 Agent 进入建议、审批、工单和写回流程。Palantir Ontology 与中数睿智动态本体是两种实现路径。图为作者归纳。</desc>
  <defs>
    <pattern id="paperDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#315a68" opacity=".08"/></pattern>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d6a62"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8f6a34"/></marker>
  </defs>
  <rect width="390" height="1040" rx="16" fill="#f5f3eb"/><rect width="390" height="1040" rx="16" fill="url(#paperDots)"/>
  <text x="24" y="34" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#8f6a34">AUTHOR'S MODEL · BUSINESS CONTEXT</text>
  <text x="24" y="68" font-family="Noto Serif SC, Songti SC, serif" font-size="23" font-weight="700" fill="#171714">企业 AI 需要业务中间层</text>
  <text x="24" y="92" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#69665f">数据先变成可识别、可约束、可执行的业务世界。</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <text x="24" y="127" font-size="10" font-weight="700" letter-spacing="1.2" fill="#77736b">01 · 业务系统</text>
    <rect x="24" y="141" width="342" height="105" rx="12" fill="#fffdfa" stroke="#c8c0b3"/>
    <rect x="40" y="158" width="64" height="30" rx="6" fill="#ebe7dc"/><text x="72" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#514b42">ERP</text>
    <rect x="112" y="158" width="64" height="30" rx="6" fill="#e4eceb"/><text x="144" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#40545a">MES</text>
    <rect x="184" y="158" width="64" height="30" rx="6" fill="#eee8e1"/><text x="216" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#5c4b3e">CRM</text>
    <rect x="256" y="158" width="94" height="30" rx="6" fill="#e9e5ec"/><text x="303" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#544b58">供应链</text>
    <rect x="40" y="198" width="136" height="30" rx="6" fill="#e4eceb"/><text x="108" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#40545a">传感器 · 设备</text>
    <rect x="184" y="198" width="166" height="30" rx="6" fill="#ebe7dc"/><text x="267" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#514b42">文档 · 制度 · 知识</text>
    <path d="M195 246v26" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrowInk)"/>

    <text x="24" y="291" font-size="10" font-weight="700" letter-spacing="1.2" fill="#77736b">02 · 业务中间层</text>
    <rect x="24" y="305" width="342" height="302" rx="15" fill="#fffdfa" stroke="#a9a195"/>
    <path d="M24 320a15 15 0 0 1 15-15h312a15 15 0 0 1 15 15v50H24Z" fill="#171714"/>
    <text x="44" y="336" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#faf8f1">可操作的业务语境</text>
    <text x="44" y="357" font-size="10" fill="#c9c4b9">把零散字段翻译为业务概念与行动边界</text>
    <rect x="44" y="390" width="88" height="34" rx="7" fill="#efe8dc"/><text x="88" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#6d522d">业务对象</text>
    <rect x="141" y="390" width="88" height="34" rx="7" fill="#e5eceb"/><text x="185" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#315a68">对象关系</text>
    <rect x="238" y="390" width="108" height="34" rx="7" fill="#eee7df"/><text x="292" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#805b3d">业务规则</text>
    <rect x="44" y="434" width="136" height="34" rx="7" fill="#e9e5ec"/><text x="112" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#5e5068">实时状态</text>
    <rect x="190" y="434" width="156" height="34" rx="7" fill="#ebe7dc"/><text x="268" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#6d522d">权限与审计</text>
    <text x="44" y="494" font-size="10" font-weight="700" letter-spacing="1.1" fill="#77736b">两种实现路径</text>
    <rect x="44" y="507" width="302" height="39" rx="8" fill="#e4eceb" stroke="#9fb4b7"/><circle cx="63" cy="526.5" r="5" fill="#315a68"/><text x="77" y="531" font-size="12" font-weight="700" fill="#274a55">Palantir Ontology</text>
    <rect x="44" y="556" width="302" height="39" rx="8" fill="#efe8dc" stroke="#cbb993"/><circle cx="63" cy="575.5" r="5" fill="#8f6a34"/><text x="77" y="580" font-size="12" font-weight="700" fill="#725328">中数睿智动态本体</text>
    <path d="M195 607v26" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrowInk)"/>

    <text x="24" y="653" font-size="10" font-weight="700" letter-spacing="1.2" fill="#77736b">03 · 模型与 AGENT</text>
    <rect x="24" y="667" width="342" height="110" rx="13" fill="#1f292b"/>
    <circle cx="78" cy="722" r="30" fill="#315a68"/><path d="M64 718h28M68 709h20M68 727h20" stroke="#eef4f3" stroke-width="2" stroke-linecap="round"/>
    <text x="126" y="709" font-family="Noto Serif SC, Songti SC, serif" font-size="17" font-weight="700" fill="#f5f3eb">检索、分析、推理、规划</text>
    <text x="126" y="734" font-size="11" fill="#d8e3e5">AI 读取业务状态，也受规则与权限约束</text>
    <text x="126" y="754" font-size="10" fill="#aebbbc">模型能力通过 Agent 进入工作流</text>
    <path d="M195 777v26" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrowInk)"/>

    <text x="24" y="823" font-size="10" font-weight="700" letter-spacing="1.2" fill="#77736b">04 · 受控行动</text>
    <rect x="24" y="837" width="342" height="96" rx="13" fill="#fffdfa" stroke="#c8c0b3"/>
    <rect x="40" y="855" width="70" height="28" rx="6" fill="#e4eceb"/><text x="75" y="874" text-anchor="middle" font-size="10" font-weight="700" fill="#315a68">建议</text>
    <path d="M110 869h12" stroke="#6d6a62" marker-end="url(#arrowInk)"/>
    <rect x="127" y="855" width="70" height="28" rx="6" fill="#ebe7dc"/><text x="162" y="874" text-anchor="middle" font-size="10" font-weight="700" fill="#6d522d">审批</text>
    <path d="M197 869h12" stroke="#6d6a62" marker-end="url(#arrowInk)"/>
    <rect x="214" y="855" width="60" height="28" rx="6" fill="#eee7df"/><text x="244" y="874" text-anchor="middle" font-size="10" font-weight="700" fill="#805b3d">工单</text>
    <path d="M274 869h12" stroke="#6d6a62" marker-end="url(#arrowInk)"/>
    <rect x="291" y="855" width="59" height="28" rx="6" fill="#e9e5ec"/><text x="320.5" y="874" text-anchor="middle" font-size="10" font-weight="700" fill="#5e5068">写回</text>
    <text x="195" y="913" text-anchor="middle" font-size="11" fill="#6d665a">进入真实系统，而非停留在对话框</text>
    <path d="M195 933v20" stroke="#8f6a34" stroke-width="1.8" marker-end="url(#arrowGold)"/>
    <rect x="48" y="962" width="294" height="46" rx="8" fill="#f5f3eb" stroke="#cbb993"/>
    <text x="195" y="982" text-anchor="middle" font-size="11" font-weight="700" fill="#8f6a34">05 · 结果成为下一轮决策的新状态</text>
    <text x="195" y="998" text-anchor="middle" font-size="10" fill="#6d665a">反馈进入数据、规则与评估</text>
    <path d="M48 985H15V195h9" fill="none" stroke="#8f6a34" stroke-width="1.5" marker-end="url(#arrowGold)"/>
  </g>
  <text x="24" y="1028" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#6d665a">作者归纳：方向相似，产品边界与成熟度不同。</text>
</svg>
