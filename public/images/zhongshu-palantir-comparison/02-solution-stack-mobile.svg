<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1420" viewBox="0 0 390 1420" role="img" aria-labelledby="title desc">
  <title id="title">Palantir 与中数睿智六层解决方案架构对照移动版</title>
  <desc id="desc">依次从数据底座、业务语义、运行算力、应用开发、治理进化和交付方案，对照 Palantir 与中数睿智的公开产品能力。层级为作者归纳，不代表产品一一对应。</desc>
  <defs><pattern id="paperDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#315a68" opacity=".075"/></pattern></defs>
  <rect width="390" height="1420" rx="16" fill="#f5f3eb"/><rect width="390" height="1420" rx="16" fill="url(#paperDots)"/>
  <text x="24" y="33" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#8f6a34">PUBLIC PRODUCT MAP · AUTHOR'S SYNTHESIS</text>
  <text x="24" y="67" font-family="Noto Serif SC, Songti SC, serif" font-size="23" font-weight="700" fill="#171714">两家公司怎样组织产品栈</text>
  <text x="24" y="93" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#69665f">相似问题被拆成不同产品、组件与交付方法。</text>
  <text x="24" y="111" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#69665f">以下对齐用于理解，不等于能力一一映射。</text>
  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <rect x="24" y="134" width="164" height="36" rx="8" fill="#315a68"/><circle cx="43" cy="152" r="5" fill="#d8e3e5"/><text x="57" y="157" font-size="12" font-weight="700" fill="#f5f3eb">Palantir</text><text x="174" y="156" text-anchor="end" font-size="9" fill="#d8e3e5">FOUNDRY · AIP</text>
    <rect x="198" y="134" width="168" height="36" rx="8" fill="#8f6a34"/><circle cx="217" cy="152" r="5" fill="#f2e9d8"/><text x="231" y="157" font-size="12" font-weight="700" fill="#fffdf7">中数睿智</text><text x="352" y="156" text-anchor="end" font-size="9" fill="#f2e9d8">AI-NATIVE</text>

    <g>
      <text x="24" y="204" font-size="12" font-weight="700" fill="#24231f">01 · 数据底座</text><text x="342" y="204" text-anchor="end" font-size="10" fill="#77736b">接入 · 治理 · 供给</text>
      <rect x="24" y="217" width="342" height="58" rx="9" fill="#edf2f1" stroke="#b7c6c4"/>
      <circle cx="43" cy="238" r="5" fill="#315a68"/><text x="56" y="243" font-size="12" font-weight="700" fill="#274a55">Foundry 数据资产与数据服务</text><text x="43" y="263" font-size="10" fill="#4e6267">集成、血缘、转换、质量与实时数据</text>
      <rect x="24" y="285" width="342" height="66" rx="9" fill="#f3ede2" stroke="#d4c29f"/>
      <circle cx="43" cy="307" r="5" fill="#8f6a34"/><text x="56" y="312" font-size="12" font-weight="700" fill="#725328">起源数据工厂 · AI 数据治理</text><text x="43" y="335" font-size="10" fill="#715f43">面向模型与 Agent 组织数据供给</text>
      <path d="M24 367H366" stroke="#d4cec1"/>
    </g>

    <g>
      <text x="24" y="394" font-size="12" font-weight="700" fill="#24231f">02 · 业务语义</text><text x="342" y="394" text-anchor="end" font-size="10" fill="#77736b">对象 · 关系 · 行动</text>
      <rect x="24" y="407" width="342" height="58" rx="9" fill="#fffdfa" stroke="#b7c6c4"/>
      <circle cx="43" cy="428" r="5" fill="#315a68"/><text x="56" y="433" font-size="12" font-weight="700" fill="#274a55">Ontology</text><text x="43" y="453" font-size="10" fill="#4e6267">对象、属性、关系、动作与动态安全</text>
      <rect x="24" y="475" width="342" height="66" rx="9" fill="#fffdfa" stroke="#d4c29f"/>
      <circle cx="43" cy="497" r="5" fill="#8f6a34"/><text x="56" y="502" font-size="12" font-weight="700" fill="#725328">全知中枢</text><text x="43" y="523" font-size="10" fill="#715f43">公开报道另称“动态本体”，描述对象、逻辑与行动</text>
      <path d="M24 557H366" stroke="#d4cec1"/>
    </g>

    <g>
      <text x="24" y="584" font-size="12" font-weight="700" fill="#24231f">03 · 运行与算力</text><text x="342" y="584" text-anchor="end" font-size="10" fill="#77736b">状态 · 计算 · 训推</text>
      <rect x="24" y="597" width="342" height="58" rx="9" fill="#edf2f1" stroke="#b7c6c4"/>
      <circle cx="43" cy="618" r="5" fill="#315a68"/><text x="56" y="623" font-size="12" font-weight="700" fill="#274a55">Ontology Engine</text><text x="43" y="643" font-size="10" fill="#4e6267">读取、订阅、查询、事务、批流与 CDC</text>
      <rect x="24" y="665" width="342" height="66" rx="9" fill="#f3ede2" stroke="#d4c29f"/>
      <circle cx="43" cy="687" r="5" fill="#8f6a34"/><text x="56" y="692" font-size="12" font-weight="700" fill="#725328">模型训推与算力</text><text x="43" y="713" font-size="10" fill="#715f43">训练、推理、调度与算力相关能力</text>
      <path d="M24 747H366" stroke="#d4cec1"/>
    </g>

    <g>
      <text x="24" y="774" font-size="12" font-weight="700" fill="#24231f">04 · 应用与开发</text><text x="342" y="774" text-anchor="end" font-size="10" fill="#77736b">工具 · Agent · 应用</text>
      <rect x="24" y="787" width="342" height="62" rx="9" fill="#fffdfa" stroke="#b7c6c4"/>
      <circle cx="43" cy="808" r="5" fill="#315a68"/><text x="56" y="813" font-size="11" font-weight="700" fill="#274a55">Functions · Actions · Toolchain · MCP · AIP</text><text x="43" y="836" font-size="10" fill="#4e6267">从业务函数、动作到应用和智能体开发</text>
      <rect x="24" y="859" width="342" height="68" rx="9" fill="#fffdfa" stroke="#d4c29f"/>
      <circle cx="43" cy="881" r="5" fill="#8f6a34"/><text x="56" y="886" font-size="11" font-weight="700" fill="#725328">智能指令 · ChatBI · 智能搜索 · 智能报告</text><text x="43" y="910" font-size="10" fill="#715f43">多 Agent 开发与面向业务人员的应用组合</text>
      <path d="M24 938H366" stroke="#d4cec1"/>
    </g>

    <g>
      <text x="24" y="965" font-size="12" font-weight="700" fill="#24231f">05 · 治理与进化</text><text x="342" y="965" text-anchor="end" font-size="10" fill="#77736b">权限 · 评估 · 反馈</text>
      <rect x="24" y="978" width="342" height="62" rx="9" fill="#edf2f1" stroke="#b7c6c4"/>
      <circle cx="43" cy="999" r="5" fill="#315a68"/><text x="56" y="1004" font-size="12" font-weight="700" fill="#274a55">动态安全 · 权限 · 审计</text><text x="43" y="1027" font-size="10" fill="#4e6267">对象级许可、变更审查与运行治理</text>
      <rect x="24" y="1050" width="342" height="68" rx="9" fill="#f3ede2" stroke="#d4c29f"/>
      <circle cx="43" cy="1072" r="5" fill="#8f6a34"/><text x="56" y="1077" font-size="12" font-weight="700" fill="#725328">进化引擎 · 场景评估 · 知识治理</text><text x="43" y="1101" font-size="10" fill="#715f43">围绕知识与智能应用形成持续反馈</text>
      <path d="M24 1129H366" stroke="#d4cec1"/>
    </g>

    <g>
      <text x="24" y="1156" font-size="12" font-weight="700" fill="#24231f">06 · 交付与方案</text><text x="342" y="1156" text-anchor="end" font-size="10" fill="#77736b">验证 · 现场 · 复用</text>
      <rect x="24" y="1169" width="342" height="62" rx="9" fill="#fffdfa" stroke="#b7c6c4"/>
      <circle cx="43" cy="1190" r="5" fill="#315a68"/><text x="56" y="1195" font-size="12" font-weight="700" fill="#274a55">Bootcamp · FDE · AI FDE</text><text x="43" y="1218" font-size="10" fill="#4e6267">短周期验证、现场交付、平台内 AI 工程代理</text>
      <rect x="24" y="1241" width="342" height="68" rx="9" fill="#fffdfa" stroke="#d4c29f"/>
      <circle cx="43" cy="1263" r="5" fill="#8f6a34"/><text x="56" y="1268" font-size="12" font-weight="700" fill="#725328">行业方案 · AI-FDE</text><text x="43" y="1292" font-size="10" fill="#715f43">央国企、能源、电信；公司定义的交付方法</text>
    </g>
  </g>
  <path d="M24 1338H366" stroke="#d4cec1"/>
  <text x="24" y="1361" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#6d665a">阅读边界</text>
  <text x="24" y="1380" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#6d665a">层级为作者归纳，不代表产品一一对应；</text>
  <text x="24" y="1397" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" fill="#6d665a">公开资料未披露，不等于相关能力不存在。</text>
</svg>
