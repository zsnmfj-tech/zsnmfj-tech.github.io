    <rect x="674" y="304" width="270" height="28" rx="7" fill="#efe5d4"/><circle cx="695" cy="318" r="5" fill="#8f6a34"/><text x="709" y="323" font-size="12" fill="#7a592c">公司或媒体材料描述</text>

    <rect x="58" y="351" width="924" height="54" rx="8" fill="#fffdfa" stroke="#d5cfc3"/>
    <text x="82" y="384" font-size="14" font-weight="700" fill="#24231f">可执行动作</text>
    <rect x="340" y="364" width="270" height="28" rx="7" fill="#e4eceb"/><circle cx="361" cy="378" r="5" fill="#315a68"/><text x="375" y="383" font-size="12" fill="#315a68">官方文档明确</text>
    <rect x="674" y="364" width="270" height="28" rx="7" fill="#efe5d4"/><circle cx="695" cy="378" r="5" fill="#8f6a34"/><text x="709" y="383" font-size="12" fill="#7a592c">公司或媒体材料描述</text>

    <rect x="58" y="411" width="924" height="54" rx="8" fill="#f0eee7" stroke="#d5cfc3"/>
    <text x="82" y="444" font-size="14" font-weight="700" fill="#24231f">细粒度权限</text>
    <rect x="340" y="424" width="270" height="28" rx="7" fill="#e4eceb"/><circle cx="361" cy="438" r="5" fill="#315a68"/><text x="375" y="443" font-size="12" fill="#315a68">官方文档明确</text>
    <rect x="674" y="424" width="270" height="28" rx="7" fill="#e7e4dc" stroke="#c9c4ba"/><circle cx="695" cy="438" r="5" fill="none" stroke="#8f8a80"/><text x="709" y="443" font-size="12" fill="#6c6962">本次材料未重点披露</text>

    <rect x="58" y="471" width="924" height="54" rx="8" fill="#fffdfa" stroke="#d5cfc3"/>
    <text x="82" y="504" font-size="14" font-weight="700" fill="#24231f">实时状态与事务</text>
    <rect x="340" y="484" width="270" height="28" rx="7" fill="#e4eceb"/><circle cx="361" cy="498" r="5" fill="#315a68"/><text x="375" y="503" font-size="12" fill="#315a68">官方文档明确</text>
    <rect x="674" y="484" width="270" height="28" rx="7" fill="#e7e4dc" stroke="#c9c4ba"/><circle cx="695" cy="498" r="5" fill="none" stroke="#8f8a80"/><text x="709" y="503" font-size="12" fill="#6c6962">本次材料未重点披露</text>

    <rect x="58" y="531" width="924" height="54" rx="8" fill="#f0eee7" stroke="#d5cfc3"/>
    <text x="82" y="564" font-size="14" font-weight="700" fill="#24231f">持续更新与评估</text>
    <rect x="340" y="544" width="270" height="28" rx="7" fill="#e4eceb"/><circle cx="361" cy="558" r="5" fill="#315a68"/><text x="375" y="563" font-size="12" fill="#315a68">持续反馈 · AIP Evals</text>
    <rect x="674" y="544" width="270" height="28" rx="7" fill="#efe5d4"/><circle cx="695" cy="558" r="5" fill="#8f6a34"/><text x="709" y="563" font-size="12" fill="#7a592c">动态更新 · 场景评估</text>

    <rect x="58" y="591" width="924" height="54" rx="8" fill="#fffdfa" stroke="#d5cfc3"/>
    <text x="82" y="624" font-size="14" font-weight="700" fill="#24231f">因果与反事实</text>
    <rect x="340" y="604" width="270" height="28" rx="7" fill="#e7e4dc" stroke="#c9c4ba"/><circle cx="361" cy="618" r="5" fill="none" stroke="#8f8a80"/><text x="375" y="623" font-size="12" fill="#6c6962">本次材料未重点披露</text>
    <rect x="674" y="604" width="270" height="28" rx="7" fill="#efe5d4"/><circle cx="695" cy="618" r="5" fill="#8f6a34"/><text x="709" y="623" font-size="12" fill="#7a592c">因果引擎 · 反事实推演</text>
  </g>

  <line x1="58" y1="664" x2="982" y2="664" stroke="#cec8bc"/>
  <text x="58" y="685" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#6c6962">作者依据双方官网、产品文档及公开报道归纳；“未重点披露”不等于“不具备”，需在 PoC 中核验。</text>
</svg>
