<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" role="img" aria-labelledby="title desc">
<title id="title">产业演化与应用反馈</title>
<desc id="desc">基础设施、应用探索和新的运行方式相互反馈，阶段会重叠。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="390" height="720" fill="#f6f2e9"/>
<text x="24" y="33" class="label" text-anchor="start"><tspan x="24" dy="0">01 / 产业演化</tspan></text><text x="24" y="73" class="title" text-anchor="start"><tspan x="24" dy="0">智能的普及，</tspan><tspan x="24" dy="34">还需要应用的探索</tspan></text><rect x="24" y="140" width="320" height="139" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="44" y="172" class="node" text-anchor="start"><tspan x="44" dy="0">技术成为基础设施</tspan></text><text x="44" y="205" class="body" text-anchor="start"><tspan x="44" dy="0">基础能力可计量、可调用</tspan><tspan x="44" dy="27">可靠性与成本继续改进</tspan></text><rect x="24" y="317" width="320" height="139" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="44" y="349" class="node" text-anchor="start"><tspan x="44" dy="0">应用展开探索</tspan></text><text x="44" y="382" class="body" text-anchor="start"><tspan x="44" dy="0">试验需求、交互和交付</tspan><tspan x="44" dy="27">积累成功与失败反馈</tspan></text><rect x="24" y="494" width="320" height="139" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="44" y="526" class="node" text-anchor="start"><tspan x="44" dy="0">形成新的运行方式</tspan></text><text x="44" y="559" class="body" text-anchor="start"><tspan x="44" dy="0">部分应用被持续采用</tspan><tspan x="44" dy="27">形成新入口与新需求</tspan></text><path d="M184 283V309" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M184 460V486" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M348 568H367V210H350" fill="none" stroke="#986b2e" stroke-width="2" marker-end="url(#gold)"/><text x="24" y="668" class="small" text-anchor="start"><tspan x="24" dy="0">金色回路：应用反馈推动技术发展</tspan><tspan x="24" dy="24">阶段会重叠，不预设完成年份。</tspan></text>
</svg>
