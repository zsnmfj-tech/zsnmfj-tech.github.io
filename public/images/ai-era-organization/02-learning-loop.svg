<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">智能复利怎样形成</title>
<desc id="desc">执行任务后观察结果，区分原因，改进并验证后才能复用。失败需要复核，不能把日志直接等同于训练材料。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="960" height="600" fill="#f6f2e9"/>
<text x="36" y="39" class="label" text-anchor="start"><tspan x="36" dy="0">02 / 能力积累</tspan></text><text x="36" y="84" class="title" text-anchor="start"><tspan x="36" dy="0">完成任务以后，能力怎样留下来</tspan></text><text x="36" y="118" class="small" text-anchor="start"><tspan x="36" dy="0">输入是实际任务，输出是经过验证、能够复用的做法。</tspan></text><rect x="36" y="158" width="268" height="148" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="56" y="190" class="node" text-anchor="start"><tspan x="56" dy="0">执行真实任务</tspan></text><text x="56" y="223" class="body" text-anchor="start"><tspan x="56" dy="0">明确目标与使用范围</tspan><tspan x="56" dy="27">调用工具，保留任务记录</tspan></text><rect x="346" y="158" width="268" height="148" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="366" y="190" class="node" text-anchor="start"><tspan x="366" dy="0">观察实际结果</tspan></text><text x="366" y="223" class="body" text-anchor="start"><tspan x="366" dy="0">客户是否接受？</tspan><tspan x="366" dy="27">交付是否符合约定？</tspan></text><rect x="656" y="158" width="268" height="148" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="676" y="190" class="node" text-anchor="start"><tspan x="676" dy="0">复核反馈与原因</tspan></text><text x="676" y="223" class="body" text-anchor="start"><tspan x="676" dy="0">识别人工补救与遗漏</tspan><tspan x="676" dy="27">区分数据、工具和需求问题</tspan></text><rect x="656" y="372" width="268" height="142" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="676" y="404" class="node" text-anchor="start"><tspan x="676" dy="0">改进并验证</tspan></text><text x="676" y="437" class="body" text-anchor="start"><tspan x="676" dy="0">调整知识、流程或工具</tspan><tspan x="676" dy="27">评估后决定是否采用</tspan></text><rect x="36" y="372" width="268" height="142" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="56" y="404" class="node" text-anchor="start"><tspan x="56" dy="0">用于后续任务</tspan></text><text x="56" y="437" class="body" text-anchor="start"><tspan x="56" dy="0">形成可复用的能力</tspan><tspan x="56" dy="27">继续观察效果与新问题</tspan></text><path d="M308 231H340" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M618 231H650" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M790 310V365" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M650 442H310" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M170 366V313" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><text x="480" y="428" class="label" text-anchor="middle"><tspan x="480" dy="0">通过验证后</tspan><tspan x="480" dy="26">才进入复用</tspan></text><text x="36" y="564" class="small" text-anchor="start"><tspan x="36" dy="0">作者分析 · 人工复核与授权始终保留 · 业务日志不会自动变成训练数据</tspan></text>
</svg>
