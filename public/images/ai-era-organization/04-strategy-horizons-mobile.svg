<svg xmlns="http://www.w3.org/2000/svg" width="390" height="810" viewBox="0 0 390 810" role="img" aria-labelledby="title desc">
<title id="title">长期方向怎样连接近期行动</title>
<desc id="desc">长期方向、中期里程碑与近期试验之间保留动态调整关系，不是固定的时间承诺。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="390" height="810" fill="#f6f2e9"/>
<text x="24" y="33" class="label" text-anchor="start"><tspan x="24" dy="0">04 / 战略路径</tspan></text><text x="24" y="73" class="title" text-anchor="start"><tspan x="24" dy="0">中期里程碑，</tspan><tspan x="24" dy="34">把愿景连接到行动</tspan></text><rect x="24" y="140" width="318" height="145" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="44" y="172" class="node" text-anchor="start"><tspan x="44" dy="0">长期方向</tspan></text><text x="44" y="205" class="body" text-anchor="start"><tspan x="44" dy="0">方案能力形成产品</tspan><tspan x="44" dy="27">支持持续、可重复的交付</tspan></text><rect x="24" y="328" width="318" height="165" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="44" y="360" class="node" text-anchor="start"><tspan x="44" dy="0">中期里程碑</tspan></text><text x="44" y="393" class="body" text-anchor="start"><tspan x="44" dy="0">相似需求可以复用</tspan><tspan x="44" dy="27">不同人员能稳定交付</tspan><tspan x="44" dy="27">新增客户的成本可承担</tspan></text><rect x="24" y="536" width="318" height="145" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="44" y="568" class="node" text-anchor="start"><tspan x="44" dy="0">近期试验</tspan></text><text x="44" y="601" class="body" text-anchor="start"><tspan x="44" dy="0">选一类需求，验证客户接受度</tspan><tspan x="44" dy="27">记录修改、失败和交付结果</tspan></text><path d="M183 291V320" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)" stroke-dasharray="6 5"/><path d="M183 499V528" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)" stroke-dasharray="6 5"/><path d="M348 607H368V212H349" fill="none" stroke="#986b2e" stroke-width="2" marker-end="url(#gold)"/><text x="24" y="719" class="small" text-anchor="start"><tspan x="24" dy="0">金色回路：按证据修订路径</tspan><tspan x="24" dy="26">虚线：仍需验证的连接</tspan></text><text x="24" y="786" class="small" text-anchor="start"><tspan x="24" dy="0">作者示例 · 不预设固定时间周期</tspan></text>
</svg>
