<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">战略怎样在组织中生成</title>
<desc id="desc">外部信号进入共同理解，再形成假设、试验、复盘和负责人决策，资源调整产生新的任务与反馈。AI辅助分析但不代替责任。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="960" height="650" fill="#f6f2e9"/>
<text x="36" y="39" class="label" text-anchor="start"><tspan x="36" dy="0">05 / 战略生成</tspan></text><text x="36" y="84" class="title" text-anchor="start"><tspan x="36" dy="0">让真实问题进入下一次决策</tspan></text><text x="36" y="118" class="small" text-anchor="start"><tspan x="36" dy="0">循环的结果是方向与资源的取舍，不是一份自动生成的战略报告。</tspan></text><rect x="36" y="161" width="268" height="148" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="56" y="193" class="node" text-anchor="start"><tspan x="56" dy="0">收集业务信号</tspan></text><text x="56" y="226" class="body" text-anchor="start"><tspan x="56" dy="0">客户反馈与交付问题</tspan><tspan x="56" dy="27">技术变化与不同意见</tspan></text><rect x="346" y="161" width="268" height="148" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="366" y="193" class="node" text-anchor="start"><tspan x="366" dy="0">形成可检验的假设</tspan></text><text x="366" y="226" class="body" text-anchor="start"><tspan x="366" dy="0">共同理解哪里出了问题</tspan><tspan x="366" dy="27">提出可以被否定的解释</tspan></text><rect x="656" y="161" width="268" height="148" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="676" y="193" class="node" text-anchor="start"><tspan x="676" dy="0">安排小规模试验</tspan></text><text x="676" y="226" class="body" text-anchor="start"><tspan x="676" dy="0">限定任务与资源范围</tspan><tspan x="676" dy="27">约定看什么结果</tspan></text><rect x="656" y="366" width="268" height="148" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="676" y="398" class="node" text-anchor="start"><tspan x="676" dy="0">复盘实际结果</tspan></text><text x="676" y="431" class="body" text-anchor="start"><tspan x="676" dy="0">对照原始假设</tspan><tspan x="676" dy="27">检查遗漏和其他解释</tspan></text><rect x="346" y="366" width="268" height="148" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="366" y="398" class="node" text-anchor="start"><tspan x="366" dy="0">负责人作出取舍</tspan></text><text x="366" y="431" class="body" text-anchor="start"><tspan x="366" dy="0">继续、修改，或者停止</tspan><tspan x="366" dy="27">明确资源与责任</tspan></text><rect x="36" y="366" width="268" height="148" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="56" y="398" class="node" text-anchor="start"><tspan x="56" dy="0">调整后继续行动</tspan></text><text x="56" y="431" class="body" text-anchor="start"><tspan x="56" dy="0">形成新的任务安排</tspan><tspan x="56" dy="27">再次收集真实反馈</tspan></text><path d="M308 235H338" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M618 235H650" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M790 315V360" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M650 440H620" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M340 440H310" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M170 360V315" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><rect x="36" y="548" width="888" height="64" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="60" y="576" class="body" text-anchor="start"><tspan x="60" dy="0">AI 辅助：整理信息、比较矛盾、保留背景、追踪变化</tspan></text><text x="60" y="601" class="small" text-anchor="start"><tspan x="60" dy="0">人的责任：目标取舍、风险承诺、资源分配与决策复核</tspan></text><text x="36" y="635" class="small" text-anchor="start"><tspan x="36" dy="0">作者依据访谈归纳 · 关联不等于因果 · 每次试验保留原始假设</tspan></text>
</svg>
