<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">产业演化与应用反馈</title>
<desc id="desc">三个阶段会重叠，应用的真实需求与失败反馈持续推动基础设施发展，并非确定的时间表。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="960" height="500" fill="#f6f2e9"/>
<text x="36" y="39" class="label" text-anchor="start"><tspan x="36" dy="0">01 / 产业演化</tspan></text><text x="36" y="84" class="title" text-anchor="start"><tspan x="36" dy="0">智能的普及，还需要应用的探索</tspan></text><text x="36" y="118" class="small" text-anchor="start"><tspan x="36" dy="0">技术变得可调用以后，需求、交互和交付方式仍要经过试验。</tspan></text><rect x="36" y="157" width="268" height="184" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="56" y="189" class="node" text-anchor="start"><tspan x="56" dy="0">技术成为基础设施</tspan></text><text x="56" y="222" class="body" text-anchor="start"><tspan x="56" dy="0">稳定取得基础能力</tspan><tspan x="56" dy="27">形成计量与调用方式</tspan><tspan x="56" dy="27">可靠性、成本持续改进</tspan></text><rect x="346" y="157" width="268" height="184" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="366" y="189" class="node" text-anchor="start"><tspan x="366" dy="0">应用展开探索</tspan></text><text x="366" y="222" class="body" text-anchor="start"><tspan x="366" dy="0">试验不同用户需求</tspan><tspan x="366" dy="27">验证交互与交付方法</tspan><tspan x="366" dy="27">积累成功与失败反馈</tspan></text><rect x="656" y="157" width="268" height="184" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="676" y="189" class="node" text-anchor="start"><tspan x="676" dy="0">形成新的运行方式</tspan></text><text x="676" y="222" class="body" text-anchor="start"><tspan x="676" dy="0">部分应用被持续采用</tspan><tspan x="676" dy="27">组织更广泛的协作</tspan><tspan x="676" dy="27">产生新入口与新需求</tspan></text><path d="M308 244H340" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M618 244H650" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M790 347V393H170V347" fill="none" stroke="#986b2e" stroke-width="2" marker-end="url(#gold)"/><text x="480" y="428" class="label" text-anchor="middle"><tspan x="480" dy="0">应用需求与真实反馈，反向推动技术发展</tspan></text><text x="36" y="473" class="small" text-anchor="start"><tspan x="36" dy="0">依据访谈整理 · 无确定年份 · 各行业可能以不同节奏推进</tspan></text>
</svg>
