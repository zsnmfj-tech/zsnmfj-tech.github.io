<svg xmlns="http://www.w3.org/2000/svg" width="390" height="930" viewBox="0 0 390 930" role="img" aria-labelledby="title desc">
<title id="title">战略怎样在组织中生成</title>
<desc id="desc">业务信号、假设、试验、复盘与负责人的取舍形成循环，AI只承担辅助分析和追踪。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="390" height="930" fill="#f6f2e9"/>
<text x="24" y="33" class="label" text-anchor="start"><tspan x="24" dy="0">05 / 战略生成</tspan></text><text x="24" y="73" class="title" text-anchor="start"><tspan x="24" dy="0">让真实问题进入</tspan><tspan x="24" dy="34">下一次决策</tspan></text><rect x="24" y="140" width="318" height="106" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="44" y="172" class="node" text-anchor="start"><tspan x="44" dy="0">1  收集业务信号</tspan></text><text x="44" y="205" class="body" text-anchor="start"><tspan x="44" dy="0">客户、交付、技术与不同意见</tspan></text><rect x="24" y="277" width="318" height="106" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="44" y="309" class="node" text-anchor="start"><tspan x="44" dy="0">2  形成可检验的假设</tspan></text><text x="44" y="342" class="body" text-anchor="start"><tspan x="44" dy="0">解释问题，允许被证据否定</tspan></text><rect x="24" y="414" width="318" height="106" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="44" y="446" class="node" text-anchor="start"><tspan x="44" dy="0">3  安排小规模试验</tspan></text><text x="44" y="479" class="body" text-anchor="start"><tspan x="44" dy="0">限定范围，约定观察结果</tspan></text><rect x="24" y="551" width="318" height="106" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="44" y="583" class="node" text-anchor="start"><tspan x="44" dy="0">4  对照原始假设复盘</tspan></text><text x="44" y="616" class="body" text-anchor="start"><tspan x="44" dy="0">检查结果、遗漏与其他解释</tspan></text><rect x="24" y="688" width="318" height="106" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="44" y="720" class="node" text-anchor="start"><tspan x="44" dy="0">5  负责人取舍与安排</tspan></text><text x="44" y="753" class="body" text-anchor="start"><tspan x="44" dy="0">继续、修改或停止，分配资源</tspan></text><path d="M183 250V269" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M183 387V406" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M183 524V543" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M183 661V680" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M348 741H368V193H349" fill="none" stroke="#986b2e" stroke-width="2" marker-end="url(#gold)"/><text x="24" y="831" class="small" text-anchor="start"><tspan x="24" dy="0">金色回路：新任务再次产生反馈</tspan><tspan x="24" dy="25">AI 辅助整理、比较与追踪。</tspan><tspan x="24" dy="25">方向、风险与资源由人负责。</tspan></text><text x="24" y="916" class="small" text-anchor="start"><tspan x="24" dy="0">作者归纳 · 不将关联直接当作因果</tspan></text>
</svg>
