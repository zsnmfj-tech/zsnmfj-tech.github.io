<svg xmlns="http://www.w3.org/2000/svg" width="390" height="830" viewBox="0 0 390 830" role="img" aria-labelledby="title desc">
<title id="title">智能复利怎样形成</title>
<desc id="desc">真实任务经过结果观察、反馈复核、改进验证和后续复用形成循环。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="390" height="830" fill="#f6f2e9"/>
<text x="24" y="33" class="label" text-anchor="start"><tspan x="24" dy="0">02 / 能力积累</tspan></text><text x="24" y="73" class="title" text-anchor="start"><tspan x="24" dy="0">任务完成以后，</tspan><tspan x="24" dy="34">能力怎样留下来</tspan></text><rect x="24" y="139" width="318" height="110" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="44" y="171" class="node" text-anchor="start"><tspan x="44" dy="0">1  执行真实任务</tspan></text><text x="44" y="204" class="body" text-anchor="start"><tspan x="44" dy="0">明确目标、范围与工具</tspan></text><rect x="24" y="281" width="318" height="110" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="44" y="313" class="node" text-anchor="start"><tspan x="44" dy="0">2  观察实际结果</tspan></text><text x="44" y="346" class="body" text-anchor="start"><tspan x="44" dy="0">客户接受了吗？交付合格吗？</tspan></text><rect x="24" y="423" width="318" height="110" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="44" y="455" class="node" text-anchor="start"><tspan x="44" dy="0">3  复核反馈与原因</tspan></text><text x="44" y="488" class="body" text-anchor="start"><tspan x="44" dy="0">识别人工补救和失败原因</tspan></text><rect x="24" y="565" width="318" height="110" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="44" y="597" class="node" text-anchor="start"><tspan x="44" dy="0">4  改进并验证</tspan></text><text x="44" y="630" class="body" text-anchor="start"><tspan x="44" dy="0">修改知识、流程或工具</tspan></text><path d="M182 253V273" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M182 395V415" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M182 537V557" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M346 620H367V194H349" fill="none" stroke="#986b2e" stroke-width="2" marker-end="url(#gold)"/><text x="24" y="719" class="small" text-anchor="start"><tspan x="24" dy="0">金色回路：验证后用于下一次任务</tspan><tspan x="24" dy="27">保留人工复核与数据授权。</tspan></text><text x="24" y="791" class="small" text-anchor="start"><tspan x="24" dy="0">作者分析 · 反馈不等于自动训练</tspan></text>
</svg>
