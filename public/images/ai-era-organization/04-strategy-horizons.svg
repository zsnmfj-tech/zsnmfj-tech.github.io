<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">长期方向怎样连接近期行动</title>
<desc id="desc">客户方案业务的长期产品方向，通过中期能力里程碑连接近期试验，路径随证据修订。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="960" height="580" fill="#f6f2e9"/>
<text x="36" y="39" class="label" text-anchor="start"><tspan x="36" dy="0">04 / 战略路径</tspan></text><text x="36" y="84" class="title" text-anchor="start"><tspan x="36" dy="0">中期里程碑，把愿景连接到行动</tspan></text><text x="36" y="118" class="small" text-anchor="start"><tspan x="36" dy="0">看十年、想三年、干一年：表达三种时间尺度，不是固定规划周期。</tspan></text><rect x="36" y="160" width="258" height="198" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="56" y="192" class="node" text-anchor="start"><tspan x="56" dy="0">长期方向</tspan></text><text x="56" y="225" class="body" text-anchor="start"><tspan x="56" dy="0">把方案能力发展成</tspan><tspan x="56" dy="27">可重复交付的产品</tspan><tspan x="56" dy="27">服务持续存在的客户需求</tspan></text><rect x="340" y="160" width="280" height="198" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="360" y="192" class="node" text-anchor="start"><tspan x="360" dy="0">中期里程碑</tspan></text><text x="360" y="225" class="body" text-anchor="start"><tspan x="360" dy="0">相似需求可复用</tspan><tspan x="360" dy="27">不同人员能稳定交付</tspan><tspan x="360" dy="27">新增客户的成本可承担</tspan></text><rect x="666" y="160" width="258" height="198" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="686" y="192" class="node" text-anchor="start"><tspan x="686" dy="0">近期试验</tspan></text><text x="686" y="225" class="body" text-anchor="start"><tspan x="686" dy="0">选定一类客户需求</tspan><tspan x="686" dy="27">验证方案是否被接受</tspan><tspan x="686" dy="27">记录修改与失败原因</tspan></text><path d="M300 255H332" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)" stroke-dasharray="6 5"/><path d="M626 255H658" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)" stroke-dasharray="6 5"/><path d="M795 365V414H165V365" fill="none" stroke="#986b2e" stroke-width="2" marker-end="url(#gold)"/><text x="480" y="451" class="label" text-anchor="middle"><tspan x="480" dy="0">实际证据可以修订路径，必要时也可以改变方向</tspan></text><rect x="36" y="485" width="888" height="56" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="60" y="519" class="body" text-anchor="start"><tspan x="60" dy="0">共同检查：客户结果、能力复用、服务成本，而不只看文档数量。</tspan></text><text x="36" y="565" class="small" text-anchor="start"><tspan x="36" dy="0">作者业务示例 · 虚线为待验证的路径 · 不承诺具体完成时间</tspan></text>
</svg>
