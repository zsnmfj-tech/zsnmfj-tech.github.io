<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">部门流转与任务协作</title>
<desc id="desc">客户需求成为可交付方案的示例。左侧按部门传递，右侧由任务负责人组织销售产品研发交付与Agent在授权背景下协作。</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657586"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986b2e"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#625f58}.label{font-size:15px;fill:#986b2e;font-weight:700}.white{font-size:19px;fill:#fffdf8;font-weight:700}</style>
<rect width="960" height="640" fill="#f6f2e9"/>
<text x="36" y="39" class="label" text-anchor="start"><tspan x="36" dy="0">03 / 组织协作</tspan></text><text x="36" y="84" class="title" text-anchor="start"><tspan x="36" dy="0">同一项客户需求，怎样成为可交付方案</tspan></text><text x="36" y="117" class="small" text-anchor="start"><tspan x="36" dy="0">作者示意 · 调整的是协作方式，专业分工和结果责任仍然保留。</tspan></text><rect x="36" y="146" width="356" height="453" rx="8" fill="#eee9df" stroke="#c7beae"/><rect x="418" y="146" width="506" height="453" rx="8" fill="#e7edf1" stroke="#c7beae"/><text x="60" y="183" class="node" text-anchor="start"><tspan x="60" dy="0">沿部门逐级流转</tspan></text><text x="442" y="183" class="node" text-anchor="start"><tspan x="442" dy="0">围绕任务负责人协作</tspan></text><rect x="79" y="209" width="270" height="70" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="214" y="237" class="node" text-anchor="middle"><tspan x="214" dy="0">销售</tspan></text><text x="214" y="262" class="small" text-anchor="middle"><tspan x="214" dy="0">客户背景与承诺</tspan></text><rect x="79" y="304" width="270" height="70" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="214" y="332" class="node" text-anchor="middle"><tspan x="214" dy="0">产品</tspan></text><text x="214" y="357" class="small" text-anchor="middle"><tspan x="214" dy="0">需求与功能定义</tspan></text><rect x="79" y="399" width="270" height="70" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="214" y="427" class="node" text-anchor="middle"><tspan x="214" dy="0">研发</tspan></text><text x="214" y="452" class="small" text-anchor="middle"><tspan x="214" dy="0">评估实现与资源</tspan></text><rect x="79" y="494" width="270" height="70" rx="8" fill="#fffdf8" stroke="#c7beae"/><text x="214" y="522" class="node" text-anchor="middle"><tspan x="214" dy="0">交付</tspan></text><text x="214" y="547" class="small" text-anchor="middle"><tspan x="214" dy="0">确认约束与验收</tspan></text><path d="M214 283V296" fill="none" stroke="#657586" stroke-width="2" marker-end="url(#ink)"/><path d="M214 378V391" fill="none" stroke="#657586" stroke-width="2" marker-end="url(