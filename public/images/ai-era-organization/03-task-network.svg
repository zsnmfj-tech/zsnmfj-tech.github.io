="335" width="196" height="83" rx="8" fill="#1b3654" stroke="#1b3654"/><text x="671" y="369" class="white" text-anchor="middle"><tspan x="671" dy="0">任务负责人</tspan></text><text x="671" y="396" text-anchor="middle" font-size="15" fill="#fffdf8" style="fill:#fffdf8">资源、冲突与验收</text><rect x="573" y="497" width="196" height="70" rx="8" fill="#f0e3ca" stroke="#c7beae"/><text x="671" y="525" class="node" text-anchor="middle"><tspan x="671" dy="0">Agent</tspan></text><text x="671" y="550" class="small" text-anchor="middle"><tspan x="671" dy="0">检索、整理与授权执行</tspan></text><text x="36" y="622" class="small" text-anchor="start"><tspan x="36" dy="0">授权范围内共享信息 · 明确专业决策权 · 保留异常升级与结果验收</tspan></text>
