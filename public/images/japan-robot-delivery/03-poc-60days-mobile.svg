<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" role="img" aria-labelledby="title desc">
  <title id="title">60 天 POC 验证清单与反推的产品参数</title>
  <desc id="desc">陪住友在商用写字楼蹲点 60 天的验证清单，以及由清洁流程调研反推出的三项产品参数。</desc>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1b3654}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;font-weight:700}.label{font-size:13px;fill:#986b2e;font-weight:700}.node{font-size:18px;font-weight:700}.body{font-size:13px;font-weight:700}.small{font-size:12px;fill:#625f58}.white{fill:#fffdf8}</style>
  <rect width="390" height="1000" fill="#f6f2e9"/>
  <text x="22" y="32" class="label">03 / POC 验真</text>
  <text x="22" y="69" class="title">在客户现场蹲 60 天</text>
  <text x="22" y="99" class="small">POC 验真金：现场实跑约两个月。</text>

  <g transform="translate(22 130)">
    <rect width="346" height="310" rx="10" fill="#fffdf8" stroke="#c7beae"/>
    <text x="20" y="32" class="label">60 天 POC · 验证清单</text>
    <text x="20" y="56" class="small">陪住友在商用写字楼蹲点，逐项验证：</text>
    <text x="20" y="92" class="body">清洁 SOP 融合</text>
    <text x="20" y="114" class="small">与客户原有作业流程怎么协同</text>
    <text x="20" y="148" class="body">清洁标准</text>
    <text x="20" y="170" class="small">地要多干净、每天擦几次、灰尘吸收量</text>
    <text x="20" y="204" class="body">运行时段</text>
    <text x="20" y="226" class="small">人流高峰怎么避，保证稳定运行</text>
    <text x="20" y="260" class="body">充电桩布置</text>
    <text x="20" y="282" class="small">美观、回转半径、障碍物，讨论了一周</text>
  </g>

  <g transform="translate(22 460)">
    <rect width="346" height="260" rx="10" fill="#e7edf1" stroke="#c7beae"/>
    <text x="20" y="32" class="label">由调研反推的产品参数</text>
    <text x="20" y="56" class="small">先摸清清洁全流程，再反推设计：</text>
    <text x="20" y="92" class="body">污水回收率 95%</text>
    <text x="20" y="114" class="small">对应洗地与污水回收工序</text>
    <text x="20" y="148" class="body">静音低于家用扫地机器人</text>
    <text x="20" y="170" class="small">写字楼低噪音是硬红线，超标直接出局</text>
    <text x="20" y="204" class="body">物理按键快拆快换快修</text>
    <text x="20" y="226" class="small">适配 50-60 岁维护人员的使用习惯</text>
  </g>

  <rect x="22" y="740" width="346" height="150" rx="8" fill="#fffdf8" stroke="#c7beae"/>
  <text x="40" y="772" class="body">「自建的很多测试场景，</text>
  <text x="40" y="794" class="body">替代不了真实的工作流。」</text>
  <text x="40" y="822" class="small">实验室超市货架符合预设标准；</text>
  <text x="40" y="842" class="small">真实超市挂架高低不一、堆满后外凸，</text>
  <text x="40" y="862" class="small">碰倒了捡还是不捡？</text>
</svg>
