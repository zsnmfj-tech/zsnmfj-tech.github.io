<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" role="img" aria-labelledby="title desc">
  <title id="title">Ontology 运营闭环移动版</title>
  <desc id="desc">业务系统进入 Ontology 的数据、逻辑、动作和安全层，人和 AI 读取状态、执行动作，结果再写回原系统。</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9d4c8"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#6d6a62"/></marker>
  </defs>
  <rect width="390" height="980" fill="#f5f3eb"/><rect width="390" height="980" fill="url(#paper)" opacity=".36"/>
  <text x="24" y="34" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#8f6a34">ENTERPRISE OPERATING CONTEXT</text>
  <text x="24" y="68" font-family="Noto Serif SC, Songti SC, serif" font-size="23" font-weight="700" fill="#171714">AI 进入可操作的业务世界</text>
  <text x="24" y="92" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="12" fill="#69665f">对象、规则、动作和权限组成同一套运营语境。</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <text x="24" y="130" font-size="10" font-weight="700" letter-spacing="1.4" fill="#77736b">分散的业务系统</text>
    <rect x="24" y="148" width="78" height="44" rx="7" fill="#ebe7dc" stroke="#c8c0b3"/><text x="63" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#514b42">ERP</text>
    <rect x="112" y="148" width="78" height="44" rx="7" fill="#e4eceb" stroke="#b7c6c4"/><text x="151" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#40545a">CRM</text>
    <rect x="200" y="148" width="78" height="44" rx="7" fill="#eee8e1" stroke="#c9bcac"/><text x="239" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#5c4b3e">传感器</text>
    <rect x="288" y="148" width="78" height="44" rx="7" fill="#e9e5ec" stroke="#c5bacb"/><text x="327" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#544b58">文档</text>
    <path d="M195 194v32" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <rect x="24" y="238" width="342" height="412" rx="16" fill="#fffdfa" stroke="#b9b1a4"/>
  <path d="M24 254a16 16 0 0 1 16-16h310a16 16 0 0 1 16 16v58H24Z" fill="#171714"/>
  <text x="46" y="275" font-family="Noto Serif SC, Songti SC, serif" font-size="23" font-weight="700" fill="#faf8f1">Ontology</text>
  <text x="46" y="297" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#c9c4b9">企业运营层 · SEMANTIC + KINETIC</text>
  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <rect x="44" y="332" width="302" height="62" rx="9" fill="#efe8dc"/>
    <text x="64" y="357" font-family="Noto Serif SC, Songti SC, serif" font-size="17" font-weight="700" fill="#7c5c30">数据</text><text x="64" y="380" font-size="12" fill="#514b42">对象 · 属性 · 关系 · 实时状态</text>
    <rect x="44" y="408" width="302" height="62" rx="9" fill="#e5eceb"/>
    <text x="64" y="433" font-family="Noto Serif SC, Songti SC, serif" font-size="17" font-weight="700" fill="#315a68">逻辑</text><text x="64" y="456" font-size="12" fill="#40545a">业务规则 · 函数 · 预测模型</text>
    <rect x="44" y="484" width="302" height="62" rx="9" fill="#eee7df"/>
    <text x="64" y="509" font-family="Noto Serif SC, Songti SC, serif" font-size="17" font-weight="700" fill="#8b5e3c">动作</text><text x="64" y="532" font-size="12" fill="#5c4b3e">审批 · 工单 · 调拨 · 系统写回</text>
    <rect x="44" y="560" width="302" height="62" rx="9" fill="#e9e5ec"/>
    <text x="64" y="585" font-family="Noto Serif SC, Songti SC, serif" font-size="17" font-weight="700" fill="#5e5068">安全</text><text x="64" y="608" font-size="12" fill="#544b58">权限 · 审计 · 动态治理</text>
  </g>

  <path d="M195 650v34" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <circle cx="108" cy="746" r="54" fill="#171714"/>
    <circle cx="108" cy="729" r="12" fill="none" stroke="#f5f3eb" stroke-width="2"/><path d="M84 768c5-16 13-23 24-23s19 7 24 23" fill="none" stroke="#f5f3eb" stroke-width="2"/><text x="108" y="786" text-anchor="middle" font-size="12" font-weight="700" fill="#f5f3eb">业务人员</text>
    <circle cx="282" cy="746" r="54" fill="#315a68"/>
    <rect x="263" y="716" width="38" height="32" rx="8" fill="none" stroke="#eff4f3" stroke-width="2"/><circle cx="274" cy="732" r="2.5" fill="#eff4f3"/><circle cx="290" cy="732" r="2.5" fill="#eff4f3"/><text x="282" y="786" text-anchor="middle" font-size="12" font-weight="700" fill="#eff4f3">AI Agent</text>
    <path d="M162 746h64" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="195" y="732" text-anchor="middle" font-size="9" fill="#77736b">协同决策</text>
    <rect x="64" y="830" width="262" height="60" rx="10" fill="#fffdfa" stroke="#b9b1a4"/>
    <text x="195" y="854" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="15" font-weight="700" fill="#24231f">执行真实业务动作</text>
    <text x="195" y="876" text-anchor="middle" font-size="11" fill="#6d6a62">审批 · 调拨 · 维修 · 处置</text>
    <path d="M195 800v30" stroke="#6d6a62" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M64 860c-25 0-35 17-35 37 0 24 18 43 42 43h248c24 0 42-19 42-43" fill="none" stroke="#8f6a34" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="195" y="963" text-anchor="middle" font-size="10" font-weight="700" fill="#8f6a34">结果写回原系统，成为下一次决策的新状态</text>
  </g>
</svg>
