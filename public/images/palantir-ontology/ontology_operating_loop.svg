<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">Ontology 将企业数据转化为可执行的业务语境</title>
  <desc id="desc">左侧的 ERP、CRM、传感器和文档进入 Ontology 的数据、逻辑、动作与安全层，右侧的人和 AI 读取状态并执行受控动作，结果再同步回业务系统。</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9d4c8"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6d6a62"/></marker>
  </defs>
  <rect width="1040" height="700" fill="#f5f3eb"/>
  <rect width="1040" height="700" fill="url(#paper)" opacity=".38"/>
  <text x="58" y="50" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#8f6a34">ENTERPRISE OPERATING CONTEXT</text>
  <text x="58" y="94" font-family="Noto Serif SC, Songti SC, serif" font-size="32" font-weight="700" fill="#171714">让 AI 进入一套可操作的业务世界</text>
  <text x="58" y="124" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="15" fill="#69665f">对象有身份，规则有出处，动作有权限，执行结果会回到真实系统。</text>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <text x="60" y="176" font-size="12" font-weight="700" letter-spacing="1.8" fill="#77736b">分散的业务系统</text>
    <path d="M62 204h180" stroke="#bdb6aa"/>
    <rect x="62" y="224" width="176" height="56" rx="8" fill="#ebe7dc" stroke="#c8c0b3"/>
    <circle cx="86" cy="252" r="8" fill="#8f6a34"/>
    <text x="106" y="258" font-size="16" font-weight="700" fill="#24231f">ERP 与订单</text>
    <rect x="86" y="305" width="156" height="56" rx="8" fill="#e4eceb" stroke="#b7c6c4"/>
    <circle cx="110" cy="333" r="8" fill="#315a68"/>
    <text x="130" y="339" font-size="16" font-weight="700" fill="#24231f">CRM 与客户</text>
    <rect x="62" y="386" width="176" height="56" rx="8" fill="#eee8e1" stroke="#c9bcac"/>
    <circle cx="86" cy="414" r="8" fill="#a06b46"/>
    <text x="106" y="420" font-size="16" font-weight="700" fill="#24231f">传感器与设备</text>
    <rect x="86" y="467" width="156" height="56" rx="8" fill="#e9e5ec" stroke="#c5bacb"/>
    <circle cx="110" cy="495" r="8" fill="#66556d"/>
    <text x="130" y="501" font-size="16" font-weight="700" fill="#24231f">文档与知识</text>
    <path d="M242 252C278 252 280 290 312 290M242 333h70M238 414c38 0 42-44 74-44M242 495c38 0 42-44 70-44" fill="none" stroke="#77736b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="324" y="178" width="356" height="404" rx="18" fill="#fffdfa" stroke="#b9b1a4" stroke-width="1.5"/>
    <path d="M324 196a18 18 0 0 1 18-18h320a18 18 0 0 1 18 18v58H324Z" fill="#171714"/>
    <text x="352" y="218" font-family="Noto Serif SC, Songti SC, serif" font-size="25" font-weight="700" fill="#faf8f1">Ontology</text>
    <text x="352" y="240" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="12" letter-spacing="1.6" fill="#c9c4b9">企业运营层</text>
    <text x="650" y="224" text-anchor="end" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="11" fill="#b7b1a7">SEMANTIC + KINETIC</text>

    <rect x="348" y="278" width="308" height="62" rx="10" fill="#efe8dc"/>
    <text x="372" y="303" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#7c5c30">数据</text>
    <text x="372" y="326" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="13" fill="#514b42">对象 · 属性 · 关系 · 实时状态</text>
    <circle cx="622" cy="309" r="13" fill="#8f6a34"/><path d="M614 309h16M622 301v16" stroke="#fff" stroke-width="2"/>

    <rect x="348" y="354" width="308" height="62" rx="10" fill="#e5eceb"/>
    <text x="372" y="379" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#315a68">逻辑</text>
    <text x="372" y="402" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="13" fill="#40545a">业务规则 · 函数 · 预测模型</text>
    <path d="M609 384l9 9 18-22" fill="none" stroke="#315a68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="348" y="430" width="308" height="62" rx="10" fill="#eee7df"/>
    <text x="372" y="455" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#8b5e3c">动作</text>
    <text x="372" y="478" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="13" fill="#5c4b3e">审批 · 工单 · 调拨 · 系统写回</text>
    <path d="M608 461h27M626 452l9 9-9 9" fill="none" stroke="#9b6844" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="348" y="506" width="308" height="52" rx="10" fill="#e9e5ec"/>
    <text x="372" y="538" font-family="Noto Serif SC, Songti SC, serif" font-size="18" font-weight="700" fill="#5e5068">安全</text>
    <text x="443" y="538" font-family="ui-sans-serif, Noto Sans SC, sans-serif" font-size="13" fill="#544b58">权限 · 审计 · 动态治理</text>
    <path d="M618 520l12 5v9c0 8-5 13-12 17-7-4-12-9-12-17v-9Z" fill="none" stroke="#66556d" stroke-width="2"/>
  </g>

  <g font-family="ui-sans-serif, Noto Sans SC, sans-serif">
    <path d="M680 340h72" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M752 462h-72" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="716" y="324" text-anchor="middle" font-size="11" fill="#77736b">读取状态</text>
    <text x="716" y="486" text-anchor="middle" font-size="11" fill="#77736b">提交动作</text>
    <circle cx="820" cy="278" r="62" fill="#171714"/>
    <circle cx="820" cy="263" r="14" fill="none" stroke="#f5f3eb" stroke-width="2"/>
    <path d="M791 310c5-19 16-28 29-28s24 9 29 28" fill="none" stroke="#f5f3eb" stroke-width="2"/>
    <text x="820" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f3eb">业务人员</text>

    <circle cx="820" cy="438" r="62" fill="#315a68"/>
    <rect x="798" y="407" width="44" height="36" rx="9" fill="none" stroke="#eff4f3" stroke-width="2"/>
    <circle cx="811" cy="425" r="3" fill="#eff4f3"/><circle cx="829" cy="425" r="3" fill="#eff4f3"/>
    <path d="M820 407v-9M814 398h12" stroke="#eff4f3" stroke-width="2" stroke-linecap="round"/>
    <text x="820" y="476" text-anchor="middle" font-size="13" font-weight="700" fill="#eff4f3">AI Agent</text>

    <rect x="744" y="542" width="152" height="54" rx="9" fill="#fffdfa" stroke="#b9b1a4"/>
    <text x="820" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#24231f">真实业务动作</text>
    <text x="820" y="584" text-anchor="middle" font-size="11" fill="#6d6a62">审批 · 调拨 · 维修 · 处置</text>
    <path d="M820 500v42" stroke="#6d6a62" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M896 569c58 0 69 22 69 48 0 22-17 39-39 39H154c-35 0-58-19-58-49v-46" fill="none" stroke="#8f6a34" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="530" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#8f6a34">执行结果同步回业务系统，成为下一次决策的新状态</text>
  </g>
</svg>
